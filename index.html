<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gen AI Expert Roadmap</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #030712; color: #e5e7eb; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
    .glass-nav { background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(31, 41, 55, 0.8); }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  
  <div id="root">
    <div class="flex flex-col items-center justify-center h-screen text-center p-5">
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h2 class="text-xl font-bold text-white">Initializing Workspace...</h2>
      <p class="text-gray-500 mt-2 text-sm">If this takes too long, check the browser console (F12) for errors.</p>
    </div>
  </div>

  <script type="text/babel" data-presets="react">
    // --- 1. FIREBASE SETUP ---
    const firebaseConfig = {
      apiKey: "AIzaSyCs26V2vAc6Knk-etZXz6QCvEoLgzwEbJ8",
      authDomain: "gen-ai-roadmap-61c58.firebaseapp.com",
      projectId: "gen-ai-roadmap-61c58",
      storageBucket: "gen-ai-roadmap-61c58.firebasestorage.app",
      messagingSenderId: "757610453012",
      appId: "1:757610453012:web:962f94fa0e6a6a5748ef01"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    db.enablePersistence().catch(err => console.warn("Offline persistence issue:", err));

    // --- 2. DATA (16 Weeks) ---
    const ROADMAP_DATA = [
      { id: "w1", title: "Week 1: Foundations", goal: "Build strong basics + set up tools for Al automation.", tasks: ["1. Learn basics of Al, ML, GenAl, and Automation (differences + use cases).", "2. Install Python, VS Code, Jupyter Notebook.", "3. Learn Git & GitHub basics for version control.", "4. Get familiar with ChatGPT, Claude, Gemini, Perplexity.", "5. Explore Al applications across industries.", "6. Create a Notion/Google Doc to track your Al learning journey."], resources: ["Python Basics: https://www.learnpython.org/", "Automate the Boring Stuff: https://automatetheboringstuff.com/", "GitHub Basics: https://docs.github.com/en/get-started", "Intro to Al: https://www.youtube.com/watch?v=JMUxmLyrhSk"] },
      { id: "w2", title: "Week 2: Prompt Engineering Basics", goal: "Learn the science of talking to Al.", tasks: ["1. Understand zero-shot, few-shot, and role-based prompting.", "2. Learn the difference between temperature, max tokens, and top-p.", "3. Practice writing prompts for text generation, summarization, and rewriting.", "4. Create your prompt library in Notion/Google Docs.", "5. Document prompts for different domains.", "6. Practice prompts on multiple LLMS (ChatGPT, Claude, Gemini)."], resources: ["Prompting Guide: https://www.promptingguide.ai/", "OpenAl Cookbook: https://github.com/openai/openai-cookbook", "Prompt Engineering Course: https://learn.deeplearning.ai"] },
      { id: "w3", title: "Week 3: Advanced Prompt Engineering", goal: "Master advanced prompting techniques.", tasks: ["1. Learn chain-of-thought (CoT) prompting for reasoning tasks.", "2. Explore self-consistency and multi-turn prompts.", "3. Learn how to build system prompts for structured workflows.", "4. Practice creating prompt templates for automation workflows.", "5. Explore prompt compression and optimization techniques.", "6. Start building domain-specific prompts."], resources: ["Anthropic Prompting Guide: https://docs.anthropic.com/claude/docs", "OpenAl Advanced Examples: https://platform.openai.com/examples", "Awesome Prompt Repo: https://github.com/dair-ai/awesome-prompt-engineering"] },
      { id: "w4", title: "Week 4: No-Code Al Automation", goal: "Build workflows with no-code automation tools.", tasks: ["1. Learn Zapier basics for automation.", "2. Learn Make.com to connect multiple apps with Al.", "3. Explore n8n for open-source automation.", "4. Automate workflows: Save emails to Sheets, LinkedIn posts, Summarize news.", "5. Build 3 no-code Al automation workflows.", "6. Document automation projects for your portfolio."], resources: ["Zapier Al Guide: https://zapier.com/blog/ai-automation/", "Make.com Academy: https://www.make.com/en/academy", "n8n Docs: https://docs.n8n.io/"] },
      { id: "w5", title: "Week 5: Python for Automation", goal: "Automate tasks using Python.", tasks: ["1. Learn Python libraries: os, time, schedule, shutil.", "2. Write scripts for: File organization, reminders, Cleaning data.", "3. Automate repetitive tasks from your own computer.", "4. Use schedule and cron jobs for task scheduling.", "5. Create an automation project repo on GitHub.", "6. Document scripts with README files."], resources: ["Automate the Boring Stuff: https://automatetheboringstuff.com/", "Schedule Library: https://schedule.readthedocs.io/en/stable/", "Real Python Automation: https://realpython.com/"] },
      { id: "w6", title: "Week 6: Web Automation & Scraping", goal: "Automate interactions with websites.", tasks: ["1. Learn web scraping using BeautifulSoup & Requests.", "2. Use Selenium/Playwright for browser automation.", "3. Automate: Logging in, Scraping jobs, Auto-filling forms.", "4. Build a script to scrape jobs & send summaries with GPT.", "5. Document step-by-step automation workflows.", "6. Add project to your GitHub portfolio."], resources: ["BeautifulSoup Tutorial: https://realpython.com/beautiful-soup-web-scraper-python/", "Selenium Docs: https://www.selenium.dev/documentation/", "Playwright Python: https://playwright.dev/python/docs/intro"] },
      { id: "w7", title: "Week 7: API Automation Basics", goal: "Learn API fundamentals for automation.", tasks: ["1. Understand REST API basics (GET, POST, PUT).", "2. Use requests in Python to fetch data from APIs.", "3. Automate: Fetching news, Sending Slack/WhatsApp alerts, Posting tweets.", "4. Learn API authentication (keys, tokens, OAuth).", "5. Combine multiple APIs in one script.", "6. Document API projects in GitHub."], resources: ["REST API Guide: https://restfulapi.net/", "Requests Library: https://requests.readthedocs.io/en/latest/", "Twitter API: https://developer.x.com/en/docs"] },
      { id: "w8", title: "Week 8: AI API Automation", goal: "Automate workflows using GenAl APIs.", tasks: ["1. Learn OpenAl API basics.", "2. Create scripts: Email writer bot, PDF summarizer, Content generator.", "3. Combine OpenAI API with Gmail, Google Sheets, Slack.", "4. Learn Hugging Face API for free models.", "5. Build an end-to-end Al content workflow.", "6. Share project publicly on GitHub."], resources: ["OpenAl API Docs: https://platform.openai.com/docs/", "Hugging Face Models: https://huggingface.co/models", "Cohere API: https://docs.cohere.com/docs"] },
      { id: "w9", title: "Week 9: End-to-End Al Workflows", goal: "Build complete Al pipelines.", tasks: ["1. Learn Airflow basics for orchestrating workflows.", "2. Build pipelines: Job scraping → Resume → Email. Feedback → Summary → Slack.", "3. Learn error handling and logging in automation.", "4. Practice pipeline deployment on cloud (Render/Heroku).", "5. Document end-to-end workflows as case studies.", "6. Add workflow diagrams to portfolio."], resources: ["Airflow Docs: https://airflow.apache.org/docs/", "LangChain Docs: https://python.langchain.com/docs/"] },
      { id: "w10", title: "Week 10: Al Agents (Intro)", goal: "Learn autonomous Al agents.", tasks: ["1. Understand what Al agents are and how they work.", "2. Explore AutoGPT, BabyAGI, and CrewAl.", "3. Build a simple research agent that fetches & summarizes.", "4. Deploy your first personal Al assistant.", "5. Document prompts + architecture for agents.", "6. Share project on LinkedIn/GitHub."], resources: ["AutoGPT Repo: https://github.com/Torantulino/Auto-GPT", "BabyAGI Repo: https://github.com/yoheinakajima/babyagi", "CrewAl Repo: https://github.com/joaomdmoura/crewAl"] },
      { id: "w11", title: "Week 11: RPA", goal: "Automate business workflows.", tasks: ["1. Learn RPA basics with UiPath/TagUI.", "2. Automate: Invoice processing, PDF extraction, Excel reporting.", "3. Connect RPA with Al APIs (OpenAl for summarization).", "4. Build Al-powered office automation.", "5. Document business automation workflows.", "6. Create GitHub repo for RPA + Al projects."], resources: ["UiPath Academy: https://academy.uipath.com/", "TagUI Docs: https://tagui.readthedocs.io/en/latest/"] },
      { id: "w12", title: "Week 12: Data Automation & RAG", goal: "Automate knowledge workflows with private data.", tasks: ["1. Learn vector databases (FAISS, Pinecone, Weaviate).", "2. Understand embeddings for semantic search.", "3. Build a PDF Q&A bot.", "4. Automate knowledge retrieval from documents.", "5. Deploy RAG system for personal data.", "6. Document & showcase project."], resources: ["FAISS Repo: https://github.com/facebookresearch/faiss", "Pinecone Docs: https://docs.pinecone.io/", "Weaviate Docs: https://weaviate.io/developers/weaviate"] },
      { id: "w13", title: "Week 13: Multimodal Al Automation", goal: "Work with images, voice, and video.", tasks: ["1. Use Whisper for speech-to-text automation.", "2. Automate voice notes → Task list.", "3. Use Stable Diffusion/DALL E for image generation.", "4. Build Al video summarizer pipeline.", "5. Integrate ElevenLabs for voice cloning.", "6. Document multimodal automation project."], resources: ["Whisper GitHub: https://github.com/openai/whisper", "Stable Diffusion: https://github.com/AUTOMATIC1111/stable-diffusion-webui", "ElevenLabs: https://elevenlabs.io/"] },
      { id: "w14", title: "Week 14: Al SaaS Development", goal: "Productize automation into SaaS tools.", tasks: ["1. Learn Flask/Django basics for web apps.", "2. Build SaaS app (Al content writer, recruiter bot).", "3. Integrate Stripe for payments.", "4. Deploy app to Vercel/Render/AWS.", "5. Add authentication & user accounts.", "6. Document SaaS app in GitHub portfolio."], resources: ["Flask Docs: https://flask.palletsprojects.com/en/3.0.x/", "Django Docs: https://www.djangoproject.com/start/", "Stripe API: https://stripe.com/docs/api", "Render Deploy: https://render.com/docs"] },
      { id: "w15", title: "Week 15: Capstone Projects", goal: "Build real-world Al products.", tasks: ["1. Al Research Assistant (scrape → summarize → report).", "2. Al Job Hunter (scrape jobs → generate resumes auto-apply).", "3. Al Social Media Manager (content generator scheduler).", "4. Al Data Q&A Bot (RAG with personal files).", "5. Al Customer Support Chatbot for business.", "6. Deploy 2-3 projects publicly and add to portfolio."], resources: ["Newspaper3k: https://github.com/codelucas/newspaper", "LangChain Resume Matching: https://python.langchain.com/docs/use cases/resume/", "Instagram Automation: https://github.com/adw0rd/instagrapi", "OpenAl Whisper: https://github.com/openai/whisper", "Notion API: https://developers.notion.com/", "Flask Framework: https://flask.palletsprojects.com/en/3.0.x/"] },
      { id: "w16", title: "Week 16: Career Prep", goal: "Become job-ready.", tasks: ["1. Finalize GitHub portfolio with documentation.", "2. Write case studies/blogs on your automation projects.", "3. Optimize LinkedIn for Al + Automation roles.", "4. Apply to jobs: Al Automation Specialist, Prompt Engineer, GenAl Expert.", "5. Explore freelancing on Upwork, Fiverr.", "6. Start building personal brand (LinkedIn posts, GitHub)."], resources: ["Prompt Engineer Jobs: https://promptengineerjobs.com/", "Upwork Al Jobs: https://www.upwork.com/freelance-jobs/ai/", "Fiverr Al Services: https://www.fiverr.com/categories/programming-tech/ai-development"] }
    ];

    const { useState, useEffect, useCallback } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [progress, setProgress] = useState({});
      const [notes, setNotes] = useState({});
      const [customLinks, setCustomLinks] = useState({}); // Stores user-added links
      
      const [loading, setLoading] = useState(true);
      const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard' or 'w1', 'w2', etc.
      
      // Add Link Modal State
      const [linkModalOpen, setLinkModalOpen] = useState(false);
      const [activeTaskKey, setActiveTaskKey] = useState(null);
      const [newLink, setNewLink] = useState({ title: '', url: '' });

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            fetchUserData(currentUser.uid);
          } else {
            setUser(null);
            setProgress({});
            setNotes({});
            setCustomLinks({});
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const fetchUserData = async (uid) => {
        try {
          const doc = await db.collection("users").doc(uid).get();
          if (doc.exists) {
            const data = doc.data();
            setProgress(data.progress || {});
            setNotes(data.notes || {});
            setCustomLinks(data.customLinks || {});
          }
        } catch (error) { console.error("Error fetching data:", error); }
        setLoading(false);
      };

      const syncToFirebase = (key, data) => {
        if (!user) return;
        db.collection("users").doc(user.uid).set({ [key]: data }, { merge: true })
          .catch(err => console.error("Sync error:", err));
      };

      const toggleTask = (weekId, taskIndex) => {
        if (!user) return alert("Please sign in to track progress.");
        const key = `${weekId}-${taskIndex}`;
        const newProgress = { ...progress, [key]: !progress[key] };
        setProgress(newProgress);
        syncToFirebase('progress', newProgress);
      };

      const updateNote = (weekId, value) => {
        if (!user) return;
        const newNotes = { ...notes, [weekId]: value };
        setNotes(newNotes);
        syncToFirebase('notes', newNotes);
      };

      const handleAddCustomLink = (e) => {
        e.preventDefault();
        if (!user) return alert("Sign in to add links.");
        if (!newLink.url.startsWith('http')) newLink.url = 'https://' + newLink.url;
        
        const existingLinks = customLinks[activeTaskKey] || [];
        const updatedLinksForTask = [...existingLinks, newLink];
        const newCustomLinksState = { ...customLinks, [activeTaskKey]: updatedLinksForTask };
        
        setCustomLinks(newCustomLinksState);
        syncToFirebase('customLinks', newCustomLinksState);
        
        setLinkModalOpen(false);
        setNewLink({ title: '', url: '' });
      };

      const handleDeleteCustomLink = (taskKey, linkIndex) => {
        const existingLinks = [...(customLinks[taskKey] || [])];
        existingLinks.splice(linkIndex, 1);
        const newCustomLinksState = { ...customLinks, [taskKey]: existingLinks };
        setCustomLinks(newCustomLinksState);
        syncToFirebase('customLinks', newCustomLinksState);
      };

      const handleSignIn = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const handleSignOut = () => auth.signOut();

      // Stats Calculations
      const totalTasks = ROADMAP_DATA.reduce((acc, w) => acc + w.tasks.length, 0);
      const completedTasks = Object.values(progress).filter(Boolean).length;
      const overallPercent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

      const getWeekStats = (weekId, taskCount) => {
        const done = Array.from({length: taskCount}).filter((_, i) => progress[`${weekId}-${i}`]).length;
        return { done, total: taskCount, percent: Math.round((done / taskCount) * 100) || 0 };
      };

      const formatUrl = (text) => {
        const parts = text.split(/(https?:\/\/[^\s]+)/g);
        return parts.map((part, i) => part.startsWith('http') ? 
          <a key={i} href={part} target="_blank" rel="noreferrer" className="text-blue-400 hover:text-blue-300 hover:underline">{part}</a> 
          : <span key={i}>{part}</span>
        );
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* STICKY TOP NAVBAR */}
          <nav className="glass-nav sticky top-0 z-40 px-4 py-3 sm:px-6 lg:px-8 shadow-md">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-4">
                {currentView !== 'dashboard' && (
                  <button onClick={() => setCurrentView('dashboard')} className="p-2 -ml-2 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                  </button>
                )}
                <div>
                  <h1 className="text-lg sm:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">GenAI Blueprint</h1>
                  <p className="text-xs text-gray-400 hidden sm:block">2026 AI Engineer Path</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {loading ? <span className="text-xs text-gray-500">...</span> : user ? (
                  <div className="flex items-center gap-3">
                    <div className="hidden sm:block text-right">
                      <p className="text-xs text-gray-300">{user.displayName || user.email}</p>
                      <p className="text-[10px] text-green-400">Cloud Synced</p>
                    </div>
                    <img src={user.photoURL || 'https://via.placeholder.com/32'} alt="avatar" className="w-8 h-8 rounded-full border border-gray-700" />
                    <button onClick={handleSignOut} className="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-md transition-colors border border-gray-700">Logout</button>
                  </div>
                ) : (
                  <button onClick={handleSignIn} className="text-sm bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md transition-colors shadow-lg shadow-blue-900/30">Sign In</button>
                )}
              </div>
            </div>
          </nav>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 w-full max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
            
            {/* VIEW 1: DASHBOARD */}
            {currentView === 'dashboard' && (
              <div className="fade-in space-y-8">
                {/* Master Stats Card */}
                <div className="bg-gradient-to-br from-gray-900 to-gray-950 p-6 sm:p-8 rounded-2xl border border-gray-800 shadow-xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-32 bg-blue-500/5 rounded-full blur-3xl"></div>
                  <div className="relative z-10 flex flex-col md:flex-row items-center gap-8">
                    {/* Circular Progress (CSS Hack) */}
                    <div className="relative w-32 h-32 flex items-center justify-center rounded-full bg-gray-800 shrink-0" 
                         style={{ background: `conic-gradient(#3b82f6 ${overallPercent}%, #1f2937 ${overallPercent}%)` }}>
                      <div className="absolute w-28 h-28 bg-gray-950 rounded-full flex flex-col items-center justify-center">
                        <span className="text-3xl font-bold text-white">{overallPercent}%</span>
                      </div>
                    </div>
                    <div className="flex-1 text-center md:text-left">
                      <h2 className="text-2xl font-bold text-white mb-2">Track Your Progress</h2>
                      <p className="text-gray-400 text-sm mb-4">You have completed <strong className="text-blue-400">{completedTasks}</strong> out of <strong className="text-gray-300">{totalTasks}</strong> tasks. Stay consistent to master AI Engineering by 2026.</p>
                      <div className="flex flex-wrap gap-4 justify-center md:justify-start">
                        <div className="bg-gray-900 px-4 py-2 rounded-lg border border-gray-800">
                          <span className="text-xs text-gray-500 block uppercase tracking-wider">Weeks</span>
                          <span className="text-lg font-semibold text-gray-200">16</span>
                        </div>
                        <div className="bg-gray-900 px-4 py-2 rounded-lg border border-gray-800">
                          <span className="text-xs text-gray-500 block uppercase tracking-wider">Total Tasks</span>
                          <span className="text-lg font-semibold text-gray-200">{totalTasks}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Week Grid */}
                <div>
                  <h3 className="text-lg font-bold text-gray-200 mb-4 px-1">Curriculum Roadmap</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {ROADMAP_DATA.map((week) => {
                      const stats = getWeekStats(week.id, week.tasks.length);
                      const isCompleted = stats.done === stats.total;
                      
                      return (
                        <div 
                          key={week.id} 
                          onClick={() => setCurrentView(week.id)}
                          className={`group cursor-pointer bg-gray-900 p-5 rounded-xl border ${isCompleted ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-gray-800 hover:border-gray-600'} transition-all duration-200 hover:-translate-y-1 shadow-md`}
                        >
                          <div className="flex justify-between items-start mb-3">
                            <h4 className="font-bold text-gray-100 group-hover:text-blue-400 transition-colors">{week.title.split(':')[0]}</h4>
                            {isCompleted ? 
                              <span className="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded border border-emerald-500/30">DONE</span> : 
                              <span className="text-xs font-mono text-gray-500">{stats.done}/{stats.total}</span>
                            }
                          </div>
                          <p className="text-xs text-gray-400 line-clamp-2 mb-4 h-8">{week.title.split(':')[1]?.trim()}</p>
                          
                          {/* Mini Progress Bar */}
                          <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                            <div className={`h-full rounded-full transition-all duration-500 ${isCompleted ? 'bg-emerald-500' : 'bg-blue-500'}`} style={{ width: `${stats.percent}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: WEEK DETAIL SCREEN */}
            {currentView !== 'dashboard' && ROADMAP_DATA.filter(w => w.id === currentView).map(week => {
              const stats = getWeekStats(week.id, week.tasks.length);
              
              return (
                <div key={week.id} className="fade-in max-w-4xl mx-auto space-y-6">
                  
                  {/* Detail Header */}
                  <div className="bg-gray-900 p-6 sm:p-8 rounded-2xl border border-gray-800 shadow-lg">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-6">
                      <div>
                        <h2 className="text-3xl font-bold text-white mb-2">{week.title}</h2>
                        <p className="text-blue-400 font-medium">{week.goal}</p>
                      </div>
                      <div className="text-right shrink-0">
                        <span className="text-3xl font-bold text-white">{stats.percent}%</span>
                        <span className="text-sm text-gray-500 block">Completed</span>
                      </div>
                    </div>
                    <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-gradient-to-r from-blue-500 to-emerald-400 h-full transition-all duration-500" style={{ width: `${stats.percent}%` }}></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    {/* Left Column: Tasks */}
                    <div className="lg:col-span-2 space-y-4">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 px-1">Action Items</h3>
                      <div className="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden divide-y divide-gray-800">
                        {week.tasks.map((task, index) => {
                          const taskKey = `${week.id}-${index}`;
                          const isChecked = !!progress[taskKey];
                          const taskLinks = customLinks[taskKey] || [];

                          return (
                            <div key={index} className={`p-4 sm:p-5 transition-colors ${isChecked ? 'bg-gray-900/40' : 'hover:bg-gray-800/50'}`}>
                              <label className="flex items-start gap-4 cursor-pointer group mb-3">
                                <div className="mt-0.5 relative flex shrink-0">
                                  <input type="checkbox" checked={isChecked} onChange={() => toggleTask(week.id, index)} className="peer sr-only" />
                                  <div className="w-6 h-6 border-2 border-gray-600 rounded bg-gray-800 peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-all"></div>
                                  {isChecked && (
                                    <svg className="absolute w-4 h-4 text-white top-1 left-1 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                  )}
                                </div>
                                <span className={`text-base leading-relaxed transition-colors ${isChecked ? 'text-gray-500 line-through' : 'text-gray-200'}`}>
                                  {task}
                                </span>
                              </label>

                              {/* Custom Links specific to this task */}
                              <div className="pl-10 space-y-2">
                                {taskLinks.map((link, lIndex) => (
                                  <div key={lIndex} className="flex items-center gap-2 text-sm bg-gray-950 p-2 rounded border border-gray-800 group/link">
                                    <svg className="w-4 h-4 text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                                    <a href={link.url} target="_blank" rel="noreferrer" className="text-blue-400 hover:underline flex-1 truncate">{link.title || link.url}</a>
                                    <button onClick={() => handleDeleteCustomLink(taskKey, lIndex)} className="text-gray-600 hover:text-red-400 p-1 opacity-0 group-hover/link:opacity-100 transition-opacity">
                                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                  </div>
                                ))}
                                
                                <button 
                                  onClick={() => { setActiveTaskKey(taskKey); setLinkModalOpen(true); }}
                                  className="text-xs text-gray-500 hover:text-blue-400 flex items-center gap-1 mt-1 transition-colors"
                                >
                                  <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                  Add Resource Link
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Right Column: Original Resources & Notes */}
                    <div className="space-y-6">
                      <div>
                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 px-1 mb-3">Curriculum Resources</h3>
                        <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">
                          {week.resources.map((res, i) => (
                            <div key={i} className="text-sm text-gray-300 pb-3 border-b border-gray-800 last:border-0 last:pb-0">
                              {formatUrl(res)}
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="flex flex-col h-64 lg:h-[calc(100%-200px)]">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 px-1 mb-3">My Week Notes</h3>
                        <textarea
                          value={notes[week.id] || ""}
                          onChange={(e) => updateNote(week.id, e.target.value)}
                          placeholder="Jot down commands, setup issues, or concepts you want to revisit..."
                          className="flex-1 w-full bg-gray-900 border border-gray-800 rounded-xl p-4 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none shadow-inner"
                        ></textarea>
                      </div>
                    </div>

                  </div>
                </div>
              );
            })}
          </main>
          
          {/* Custom Link Modal */}
          {linkModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fade-in">
              <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">Add Helpful Resource</h3>
                <form onSubmit={handleAddCustomLink} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1">Title / Description</label>
                    <input 
                      type="text" 
                      required 
                      value={newLink.title} 
                      onChange={e => setNewLink({...newLink, title: e.target.value})}
                      placeholder="e.g. Awesome Async/Await Tutorial"
                      className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm text-gray-200 focus:border-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1">URL Link</label>
                    <input 
                      type="url" 
                      required 
                      value={newLink.url} 
                      onChange={e => setNewLink({...newLink, url: e.target.value})}
                      placeholder="https://..."
                      className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm text-gray-200 focus:border-blue-500 focus:outline-none"
                    />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setLinkModalOpen(false)} className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-lg text-sm font-medium transition-colors">Cancel</button>
                    <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-900/30">Save Link</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
