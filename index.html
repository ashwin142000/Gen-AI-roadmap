              React.createElement('div', { style: { height: "100%", width: `${s.pct}%`, background: ph.accent, borderRadius: "2px", transition: "width 0.5s ease" } })
            ),
            React.createElement('div', { style: { fontSize: "9px", color: "#2D3748", marginTop: "4px" } }, ph.tag)
          );
        })
      ),

      /* JOB GUIDE VIEW */
      view === "guide" && React.createElement('div', { style: { padding: "20px 18px" } },
        React.createElement('div', { style: { fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "14px" } }, "2026 JOB MARKET INTEL"),
        [
          { title: "Entry-Level GenAI Dev", color: "#39FF14", salary: "$80K – $120K", must: ["Python proficiency", "FastAPI basics", "OpenAI/Anthropic APIs", "RAG fundamentals", "LangChain basics"], note: "Build 2–3 portfolio projects (chatbot, RAG app, API with streaming)" },
          { title: "Mid-Level AI Engineer", color: "#00D4FF", salary: "$120K – $180K", must: ["Production RAG pipelines", "LangGraph / agentic systems", "LLMOps & observability", "Vector DBs in prod", "FastAPI + deployment"], note: "Focus on LangSmith, RAGAS eval, cloud deployment (AWS/GCP)" },
          { title: "Senior GenAI Engineer", color: "#FFD700", salary: "$180K – $280K", must: ["Multi-agent architectures", "Custom eval frameworks", "Fine-tuning & RLHF", "AI governance", "System design for AI at scale"], note: "Specialize in Voice AI, GraphRAG, or enterprise compliance" },
        ].map(tier =>
          React.createElement('div', { key: tier.title, style: { marginBottom: "14px", padding: "16px", background: "#070A12", borderRadius: "8px", border: `1px solid ${tier.color}30` } },
            React.createElement('div', { style: { display: "flex", justifyContent: "space-between", marginBottom: "10px" } },
              React.createElement('div', { style: { fontSize: "13px", fontFamily: "Georgia, serif", fontWeight: "bold" } }, tier.title),
              React.createElement('div', { style: { fontSize: "11px", color: tier.color } }, tier.salary)
            ),
            React.createElement('div', { style: { fontSize: "9px", letterSpacing: "2px", color: "#4A5568", marginBottom: "6px" } }, "MUST KNOW"),
            tier.must.map(item =>
              React.createElement('div', { key: item, style: { fontSize: "11px", color: "#94A3B8", marginBottom: "3px", display: "flex", alignItems: "center", gap: "6px" } },
                React.createElement('span', { style: { color: tier.color, fontSize: "8px" } }, "▸"), item
              )
            ),
            React.createElement('div', { style: { marginTop: "10px", padding: "8px 10px", background: tier.color + "0d", borderLeft: `2px solid ${tier.color}`, fontSize: "10px", color: "#6B7280", lineHeight: "1.4" } }, `💡 ${tier.note}`)
          )
        ),
        React.createElement('div', { style: { padding: "16px", background: "#070A12", borderRadius: "8px", border: "1px solid #1A1F2E" } },
          React.createElement('div', { style: { fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "10px" } }, "🔥 HOTTEST SKILLS RIGHT NOW"),
          [
            ["LangGraph", "22% of agentic job posts", "#C084FC"],
            ["RAG + Reranking", "80% of senior roles", "#FFD700"],
            ["FastAPI + LLM streaming", "60% of backend GenAI posts", "#FF6B35"],
            ["LLMOps / observability", "Fastest growing req", "#00D4FF"],
            ["Voice AI (Whisper+TTS)", "Niche but $90+/hr contracts", "#34D399"],
            ["MCP integration", "Emerging — get in early", "#39FF14"],
          ].map(([skill, stat, color]) =>
            React.createElement('div', { key: skill, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0F1629" } },
              React.createElement('span', { style: { fontSize: "12px", color, fontWeight: "bold" } }, skill),
              React.createElement('span', { style: { fontSize: "9px", color: "#4A5568" } }, stat)
            )
          )
        )
      ),

      /* NOTE MODAL */
      noteModal && React.createElement('div', {
        style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.9)", display: "flex", alignItems: "flex-end", zIndex: 200 },
        onClick: e => e.target === e.currentTarget && setNoteModal(null)
      },
        React.createElement('div', { style: { width: "100%", background: "#070A12", borderRadius: "16px 16px 0 0", padding: "22px 18px 44px", border: "1px solid #0F1629", borderBottom: "none" } },
          React.createElement('div', { style: { fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "12px" } }, "ADD NOTE"),
          React.createElement('textarea', {
            autoFocus: true, value: noteText,
            onChange: e => setNoteText(e.target.value),
            placeholder: "Resources found, key concepts, questions to revisit...",
            style: { width: "100%", minHeight: "90px", background: "#0D1117", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#CBD5E0", padding: "12px", fontSize: "13px", fontFamily: "'Courier New', monospace", resize: "none", lineHeight: "1.5" }
          }),
          React.createElement('div', { style: { display: "flex", gap: "10px", marginTop: "12px" } },
            React.createElement('button', { onClick: () => setNoteModal(null), style: { flex: 1, padding: "12px", background: "transparent", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#4A5568", cursor: "pointer", fontSize: "12px" } }, "CANCEL"),
            React.createElement('button', { onClick: saveNote, style: { flex: 2, padding: "12px", background: "#39FF14", border: "none", borderRadius: "6px", color: "#050508", cursor: "pointer", fontSize: "12px", fontWeight: "900" } }, "SAVE NOTE")
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
