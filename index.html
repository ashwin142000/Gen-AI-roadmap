<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Eng 2026" />
  <meta name="theme-color" content="#050508" />
  <title>2026 AI Engineer Roadmap</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #000000; color: #E2E8F0; font-family: 'Courier New', Courier, monospace; overscroll-behavior: none; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { display: none; }
    button { -webkit-appearance: none; touch-action: manipulation; }
    textarea, input { -webkit-appearance: none; outline: none; font-family: inherit; }
    
    .app-container {
      max-width: 800px;
      margin: 0 auto;
      background: #050508;
      min-height: 100vh;
      position: relative;
      border-left: 1px solid #0F1629;
      border-right: 1px solid #0F1629;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    .sync-badge {
      font-size: 8px; padding: 3px 6px; border-radius: 4px; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 4px; transition: all 0.3s ease;
    }
    .sync-local { background: #1A1F2E; color: #8888AA; }
    .sync-cloud { background: rgba(57, 255, 20, 0.1); color: #39FF14; border: 1px solid rgba(57, 255, 20, 0.3); }
    .sync-syncing { background: rgba(255, 215, 0, 0.1); color: #FFD700; border: 1px solid rgba(255, 215, 0, 0.3); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
    .modal-content { width: 100%; max-width: 800px; background: #070A12; border-radius: 16px 16px 0 0; padding: 22px 18px 44px; border: 1px solid #0F1629; border-bottom: none; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .job-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .stats-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    
    .search-input::placeholder { color: #4A5568; }
    
    .link-pill {
      font-size: 9px; color: #E2E8F0; text-decoration: none; background: #0F1629; border: 1px solid #1A1F2E; padding: 4px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s;
    }
    .link-pill:hover { background: #1A1F2E; border-color: #39FF14; color: #39FF14; }

    @media (min-width: 768px) {
      .job-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      .stats-grid { grid-template-columns: 1fr 1fr; align-items: start; }
      .app-container { margin-top: 20px; margin-bottom: 20px; min-height: calc(100vh - 40px); border-radius: 12px; overflow: hidden; }
      .modal-overlay { align-items: center; }
      .modal-content { border-radius: 16px; border-bottom: 1px solid #0F1629; padding-bottom: 22px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  
  <script type="text/babel" data-presets="react">
    // ---------------------------------------------------------
    // 1. FIREBASE CONFIGURATION
    // ---------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCs26V2vAc6Knk-etZXz6QCvEoLgzwEbJ8",
      authDomain: "gen-ai-roadmap-61c58.firebaseapp.com",
      projectId: "gen-ai-roadmap-61c58",
      storageBucket: "gen-ai-roadmap-61c58.firebasestorage.app",
      messagingSenderId: "757610453012",
      appId: "1:757610453012:web:962f94fa0e6a6a5748ef01",
      measurementId: "G-2XHVBHZ0YC"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    db.enablePersistence().catch((err) => {
      console.warn("Firebase Offline Persistence:", err.code);
    });

    // ---------------------------------------------------------
    // 2. 2026 JOB MARKET DATA
    // ---------------------------------------------------------
    const PHASES = [
      {
        id: "p0", code: "01", title: "Foundations & Prompting",
        tag: "CORE SKILLS", accent: "#39FF14",
        hiring: "Baseline requirement for all AI roles",
        topics: [
          { 
            id: "p0t0", title: "Python & Git Foundations", priority: "CRITICAL", 
            desc: "Advanced Python (async/await, decorators, Pydantic) and Git workflow automation.",
            links: [{ title: "Real Python Advanced", url: "https://realpython.com/" }, { title: "Pydantic Docs", url: "https://docs.pydantic.dev/" }]
          },
          { 
            id: "p0t1", title: "Prompt Engineering & Structure", priority: "CRITICAL", 
            desc: "Few-shot, Chain-of-Thought (CoT), JSON mode, and schema-enforced output generation.",
            links: [{ title: "OpenAI Cookbook", url: "https://github.com/openai/openai-cookbook" }, { title: "Anthropic Prompting", url: "https://docs.anthropic.com/claude/docs" }]
          },
          { 
            id: "p0t2", title: "DSPy & Algorithmic Optimization", priority: "HIGH", 
            desc: "Move past manual prompting. Use DSPy to compile and optimize prompts automatically using metrics.",
            links: [{ title: "DSPy GitHub", url: "https://github.com/stanfordnlp/dspy" }]
          }
        ]
      },
      {
        id: "p1", code: "02", title: "APIs & Local Models",
        tag: "INFRASTRUCTURE", accent: "#FF6B35",
        hiring: "Cost optimization is a major focus in 2026",
        topics: [
          { 
            id: "p1t0", title: "Cloud AI APIs", priority: "CRITICAL", 
            desc: "Mastering OpenAI, Anthropic, and Gemini APIs. Streaming responses and function calling/tools.",
            links: [{ title: "Function Calling Guide", url: "https://platform.openai.com/docs/guides/function-calling" }]
          },
          { 
            id: "p1t1", title: "Local AI & SLMs", priority: "HIGH", 
            desc: "Running Small Language Models (Llama 3, Qwen) locally using Ollama, LM Studio, and vLLM for serving.",
            links: [{ title: "Ollama", url: "https://ollama.com/" }, { title: "vLLM Docs", url: "https://docs.vllm.ai/" }]
          },
          { 
            id: "p1t2", title: "Fine-Tuning Basics (LoRA)", priority: "MEDIUM", 
            desc: "Understanding Parameter-Efficient Fine-Tuning (PEFT) and LoRA using Hugging Face AutoTrain or Unsloth.",
            links: [{ title: "Unsloth (Fast Fine-tuning)", url: "https://unsloth.ai/" }]
          }
        ]
      },
      {
        id: "p2", code: "03", title: "Advanced RAG & Vector Data",
        tag: "ENTERPRISE", accent: "#00D4FF",
        hiring: "The most requested skill for backend AI Devs",
        topics: [
          { 
            id: "p2t0", title: "Vector DBs & Embeddings", priority: "CRITICAL", 
            desc: "Pinecone, Qdrant, or pgvector. Chunking strategies and dense vs. sparse embeddings (Hybrid Search).",
            links: [{ title: "Pinecone Docs", url: "https://docs.pinecone.io/" }, { title: "pgvector", url: "https://github.com/pgvector/pgvector" }]
          },
          { 
            id: "p2t1", title: "Agentic & GraphRAG", priority: "CRITICAL", 
            desc: "Moving beyond naive RAG. Implementing Semantic Routing and Knowledge Graphs (GraphRAG) for deep reasoning.",
            links: [{ title: "Microsoft GraphRAG", url: "https://microsoft.github.io/graphrag/" }, { title: "LlamaIndex", url: "https://docs.llamaindex.ai/" }]
          },
          { 
            id: "p2t2", title: "RAG Evaluation (RAGAS)", priority: "HIGH", 
            desc: "Measuring faithfulness, answer relevance, and context recall using RAGAS or TruLens.",
            links: [{ title: "RAGAS Framework", url: "https://docs.ragas.io/" }]
          }
        ]
      },
      {
        id: "p3", code: "04", title: "Agents & Orchestration",
        tag: "CUTTING EDGE", accent: "#FFD700",
        hiring: "Essential for building complex AI products",
        topics: [
          { 
            id: "p3t0", title: "LangChain & LangGraph", priority: "CRITICAL", 
            desc: "Building stateful, multi-actor applications and complex cyclic graphs for AI agents.",
            links: [{ title: "LangGraph Docs", url: "https://langchain-ai.github.io/langgraph/" }]
          },
          { 
            id: "p3t1", title: "Model Context Protocol (MCP)", priority: "CRITICAL", 
            desc: "Connecting AI models to external data sources safely using Anthropic's open MCP standard.",
            links: [{ title: "MCP Specification", url: "https://modelcontextprotocol.io/" }]
          },
          { 
            id: "p3t2", title: "Multi-Agent Frameworks", priority: "HIGH", 
            desc: "Delegating tasks across specialized agents using CrewAI or Microsoft AutoGen.",
            links: [{ title: "CrewAI", url: "https://github.com/joaomdmoura/crewAI" }, { title: "AutoGen", url: "https://microsoft.github.io/autogen/" }]
          }
        ]
      },
      {
        id: "p4", code: "05", title: "Full-Stack AI & APIs",
        tag: "PRODUCT", accent: "#C084FC",
        hiring: "Massive demand for developers who can build UI + AI",
        topics: [
          { 
            id: "p4t0", title: "FastAPI Backend Integration", priority: "CRITICAL", 
            desc: "Building robust, async API endpoints to serve AI streams and handle heavy ML processing workloads safely.",
            links: [{ title: "FastAPI", url: "https://fastapi.tiangolo.com/" }]
          },
          { 
            id: "p4t1", title: "Vercel AI SDK & Frontend Integration", priority: "CRITICAL", 
            desc: "Streaming text and generative UI (React Server Components) to the browser seamlessly.",
            links: [{ title: "Vercel AI SDK", url: "https://sdk.vercel.ai/docs" }, { title: "Next.js", url: "https://nextjs.org/" }]
          }
        ]
      },
      {
        id: "p5", code: "06", title: "LLMOps & Production",
        tag: "SENIOR ROLES", accent: "#FB7185",
        hiring: "Differentiates Juniors from Seniors",
        topics: [
          { 
            id: "p5t0", title: "Tracing & Observability", priority: "HIGH", 
            desc: "Logging LLM calls, monitoring latency, and tracking token costs using LangSmith or Helicone.",
            links: [{ title: "LangSmith", url: "https://docs.smith.langchain.com/" }, { title: "Helicone", url: "https://www.helicone.ai/" }]
          },
          { 
            id: "p5t1", title: "Guardrails & Safety", priority: "HIGH", 
            desc: "Enforcing structured outputs, preventing prompt injection, and filtering toxicity (NeMo Guardrails, Guardrails AI).",
            links: [{ title: "Guardrails AI", url: "https://www.guardrailsai.com/docs" }]
          }
        ]
      }
    ];

    const PRIORITY_META = {
      CRITICAL: { color: "#FF4444" },
      HIGH:     { color: "#FF9500" },
      MEDIUM:   { color: "#8888AA" },
    };

    const STORAGE_KEY = "genai_roadmap_2026_v3";

    // ---------------------------------------------------------
    // 3. REACT APP COMPONENT
    // ---------------------------------------------------------
    const { useState, useEffect, useCallback, useMemo } = React;

    function App() {
      const [state, setState] = useState({ done: {}, notes: {}, starred: {} });
      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("local"); 
      
      const [phase, setPhase] = useState(0);
      const [view, setView] = useState("map");
      const [noteModal, setNoteModal] = useState(null);
      const [noteText, setNoteText] = useState("");
      
      // Filters
      const [filterPriority, setFilterPriority] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [showStarredOnly, setShowStarredOnly] = useState(false);

      // Load local data
      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) setState(JSON.parse(raw));
        } catch (e) { console.error("Local storage error:", e); }
      }, []);

      // Auth & Cloud Sync
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((usr) => {
          if (usr) {
            setUser(usr);
            setSyncStatus("syncing");
            const docRef = db.collection('users').doc(usr.uid);
            
            docRef.get().then((doc) => {
              if (doc.exists) {
                // Ensure legacy accounts get the starred object
                const data = doc.data();
                setState({ done: {}, notes: {}, starred: {}, ...data });
                setSyncStatus("cloud");
              } else {
                const localRaw = localStorage.getItem(STORAGE_KEY);
                const localState = localRaw ? JSON.parse(localRaw) : { done: {}, notes: {}, starred: {} };
                docRef.set(localState);
                setState(localState);
                setSyncStatus("cloud");
              }
            }).catch(err => console.error("Error fetching data:", err));
          } else {
            setUser(null);
            setSyncStatus("local");
          }
        });
        return () => unsubscribe();
      }, []);

      const update = useCallback((nextState) => {
        setState(nextState);
        if (user) {
          setSyncStatus("syncing");
          db.collection('users').doc(user.uid).set(nextState, { merge: true })
            .then(() => setSyncStatus("cloud"))
            .catch(err => {
              console.error("Sync error:", err);
              setSyncStatus("local"); 
            });
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState)); } catch {}
      }, [user]);

      const toggleDone = (id) => update({ ...state, done: { ...state.done, [id]: !state.done[id] } });
      const toggleStar = (id) => update({ ...state, starred: { ...(state.starred || {}), [id]: !state.starred?.[id] } });
      
      const saveNote = () => {
        update({ ...state, notes: { ...state.notes, [noteModal]: noteText } });
        setNoteModal(null);
      };

      const handleLogin = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const handleLogout = () => auth.signOut();

      const handleReset = () => {
        if(confirm("Are you sure you want to clear all progress? This cannot be undone.")) {
            update({ done: {}, notes: {}, starred: {} });
        }
      };

      // Derived Data & Filtering
      const allTopics = PHASES.flatMap(p => p.topics);
      const totalDone = allTopics.filter(t => state.done[t.id]).length;
      const pct = Math.round((totalDone / allTopics.length) * 100) || 0;
      
      const phaseStats = (ph) => {
        const done = ph.topics.filter(t => state.done[t.id]).length;
        return { done, total: ph.topics.length, pct: Math.round((done / ph.topics.length) * 100) || 0 };
      };
      
      const criticalDone = allTopics.filter(t => t.priority === "CRITICAL" && state.done[t.id]).length;
      const criticalTotal = allTopics.filter(t => t.priority === "CRITICAL").length;
      
      const activePhase = PHASES[phase];
      
      const filteredTopics = useMemo(() => {
        return activePhase.topics.filter(t => {
          const matchesPriority = filterPriority === "ALL" || t.priority === filterPriority;
          const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                t.desc.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesStar = !showStarredOnly || state.starred?.[t.id];
          return matchesPriority && matchesSearch && matchesStar;
        });
      }, [activePhase, filterPriority, searchQuery, showStarredOnly, state.starred]);

      return (
        <div className="app-container" style={{ paddingBottom: "88px" }}>

          {/* HEADER */}
          <div style={{ padding: "env(safe-area-inset-top, 24px) 18px 14px", paddingTop: "max(24px, env(safe-area-inset-top))", borderBottom: "1px solid #0F1629", position: "relative", overflow: "hidden", background: "#050508" }}>
            <div style={{ position: "absolute", inset: 0, backgroundImage: "linear-gradient(rgba(57,255,20,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,20,0.04) 1px, transparent 1px)", backgroundSize: "32px 32px", pointerEvents: "none" }}></div>
            
            <div style={{ position: "relative", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "4px", color: "#39FF14", marginBottom: "8px", display: "flex", alignItems: "center", gap: "6px" }}>
                  <span style={{ display: "inline-block", width: "6px", height: "6px", borderRadius: "50%", background: "#39FF14", boxShadow: "0 0 8px #39FF14" }}></span>
                  ROADMAP 2026
                </div>
                <div style={{ fontSize: "22px", fontWeight: "900", letterSpacing: "-0.5px", lineHeight: 1.1, fontFamily: "Georgia, serif" }}>
                  The <span style={{ color: "#39FF14" }}>AI Engineer</span>
                </div>
              </div>
              
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "8px" }}>
                {user ? (
                  <button onClick={handleLogout} style={{ fontSize: "10px", background: "none", border: "1px solid #1A1F2E", color: "#CBD5E0", padding: "4px 8px", borderRadius: "4px", cursor: "pointer" }}>Log out</button>
                ) : (
                  <button onClick={handleLogin} style={{ fontSize: "10px", background: "#fff", color: "#000", border: "none", padding: "4px 8px", borderRadius: "4px", cursor: "pointer", fontWeight: "bold" }}>Sync Data</button>
                )}
                <div className={`sync-badge sync-${syncStatus}`}>
                  {syncStatus === 'local' && "💾 Local"}
                  {syncStatus === 'syncing' && "↻ Syncing"}
                  {syncStatus === 'cloud' && "☁️ Synced"}
                </div>
              </div>
            </div>

            <div style={{ marginTop: "16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#4A5568", marginBottom: "5px" }}>
                <span>{totalDone}/{allTopics.length} topics · {criticalDone}/{criticalTotal} critical</span>
                <span style={{ color: "#39FF14" }}>{pct}%</span>
              </div>
              <div style={{ background: "#0D1117", height: "5px", borderRadius: "2px", overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${pct}%`, background: "linear-gradient(90deg, #39FF14, #00D4FF)", transition: "width 0.6s cubic-bezier(0.4, 0, 0.2, 1)" }}></div>
              </div>
            </div>
          </div>

          {/* NAV */}
          <div style={{ display: "flex", borderBottom: "1px solid #0F1629", position: "sticky", top: 0, background: "#050508", zIndex: 10 }}>
            {[["map","ROADMAP"],["stats","STATS"],["guide","CAREERS"]].map(([v, label]) =>
              <button
                key={v} onClick={() => setView(v)}
                style={{ flex: 1, padding: "11px 4px", background: "none", border: "none", color: view === v ? "#39FF14" : "#2D3748", fontSize: "10px", letterSpacing: "2px", borderBottom: view === v ? "2px solid #39FF14" : "2px solid transparent", cursor: "pointer", transition: "color 0.2s" }}
              >{label}</button>
            )}
          </div>

          {/* ROADMAP VIEW */}
          {view === "map" && (
            <div>
              {/* Phase Scroller */}
              <div style={{ padding: "14px 18px 14px", display: "flex", gap: "8px", overflowX: "auto" }}>
                {PHASES.map((ph, i) => {
                  const s = phaseStats(ph);
                  const active = i === phase;
                  return (
                    <button
                      key={ph.id} onClick={() => setPhase(i)}
                      style={{ flexShrink: 0, padding: "7px 12px", border: `1px solid ${active ? ph.accent : "#1A1F2E"}`, borderRadius: "4px", background: active ? ph.accent + "18" : "transparent", color: active ? ph.accent : "#4A5568", fontSize: "10px", letterSpacing: "1px", cursor: "pointer", transition: "all 0.2s" }}
                    >
                      {ph.code} · {ph.title.split(" ")[0]}
                    </button>
                  );
                })}
              </div>

              {/* Phase Header */}
              <div style={{ padding: "0 18px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "6px" }}>
                  <div>
                    <div style={{ fontSize: "10px", color: activePhase.accent, letterSpacing: "3px", marginBottom: "3px" }}>PHASE {activePhase.code} · {activePhase.tag}</div>
                    <div style={{ fontSize: "18px", fontWeight: "bold", fontFamily: "Georgia, serif" }}>{activePhase.title}</div>
                  </div>
                </div>
                <div style={{ fontSize: "10px", color: "#4A5568", marginBottom: "10px" }}>🎯 {activePhase.hiring}</div>
              </div>

              {/* Sticky Controls (Search + Filters) */}
              <div style={{ position: "sticky", top: "40px", background: "#050508", zIndex: 9, padding: "10px 18px", borderBottom: "1px solid #0F1629", borderTop: "1px solid #0F1629", display: "flex", flexDirection: "column", gap: "10px" }}>
                <input 
                  type="text" 
                  placeholder="🔍 Search skills or tools (e.g., GraphRAG)..."
                  className="search-input"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  style={{ width: "100%", background: "#070A12", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#E2E8F0", padding: "10px 12px", fontSize: "12px" }}
                />
                <div style={{ display: "flex", gap: "6px", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", gap: "6px" }}>
                    {["ALL","CRITICAL","HIGH","MEDIUM"].map(p =>
                      <button
                        key={p} onClick={() => setFilterPriority(p)}
                        style={{ padding: "4px 8px", border: `1px solid ${filterPriority === p ? (p === "ALL" ? "#39FF14" : PRIORITY_META[p].color) : "#1A1F2E"}`, borderRadius: "4px", background: filterPriority === p ? "#0F1629" : "transparent", color: filterPriority === p ? (p === "ALL" ? "#39FF14" : PRIORITY_META[p].color) : "#4A5568", fontSize: "9px", letterSpacing: "1px", cursor: "pointer" }}
                      >{p}</button>
                    )}
                  </div>
                  <button 
                    onClick={() => setShowStarredOnly(!showStarredOnly)}
                    style={{ background: showStarredOnly ? "#39FF1420" : "transparent", border: `1px solid ${showStarredOnly ? "#39FF14" : "#1A1F2E"}`, color: showStarredOnly ? "#39FF14" : "#4A5568", padding: "4px 8px", borderRadius: "4px", fontSize: "9px", cursor: "pointer", display: "flex", alignItems: "center", gap: "4px" }}
                  >
                    {showStarredOnly ? "★ STARRED" : "☆ STARS"}
                  </button>
                </div>
              </div>

              {/* Topics List */}
              <div style={{ padding: "18px" }}>
                {filteredTopics.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "40px 20px", color: "#4A5568", fontSize: "12px" }}>
                    No topics found matching your filters.
                  </div>
                ) : (
                  filteredTopics.map(topic => {
                    const done = state.done[topic.id];
                    const starred = state.starred?.[topic.id];
                    const pm = PRIORITY_META[topic.priority];
                    const hasNote = !!state.notes[topic.id];
                    
                    return (
                      <div key={topic.id} style={{ marginBottom: "12px", border: `1px solid ${done ? activePhase.accent + "40" : "#1A1F2E"}`, borderRadius: "8px", background: done ? activePhase.accent + "05" : "#070A12", overflow: "hidden", transition: "all 0.2s ease" }}>
                        <div style={{ display: "flex", alignItems: "flex-start", padding: "14px", gap: "12px" }}>
                          
                          {/* Checkbox */}
                          <button
                            onClick={() => toggleDone(topic.id)}
                            style={{ width: "22px", height: "22px", flexShrink: 0, border: `2px solid ${done ? activePhase.accent : "#2D3748"}`, borderRadius: "4px", background: done ? activePhase.accent : "transparent", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}
                          >
                            {done && <svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4.5L3.5 7 9 1" stroke="#050508" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                          </button>
                          
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "4px" }}>
                              <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                                <span style={{ fontSize: "14px", fontWeight: "bold", color: done ? activePhase.accent : "#E2E8F0", textDecoration: done ? "line-through" : "none", opacity: done ? 0.7 : 1, fontFamily: "Georgia, serif" }}>{topic.title}</span>
                                <span style={{ fontSize: "8px", letterSpacing: "1px", padding: "2px 5px", border: `1px solid ${pm.color}33`, background: `${pm.color}10`, color: pm.color, borderRadius: "3px" }}>{topic.priority}</span>
                              </div>
                              
                              {/* Star Button */}
                              <button onClick={() => toggleStar(topic.id)} style={{ background: "none", border: "none", color: starred ? "#FFD700" : "#2D3748", fontSize: "16px", cursor: "pointer", padding: "0 4px" }}>
                                {starred ? "★" : "☆"}
                              </button>
                            </div>
                            
                            <div style={{ fontSize: "12px", color: "#94A3B8", lineHeight: "1.5", marginBottom: "8px" }}>{topic.desc}</div>
                            
                            {/* Resource Links */}
                            {topic.links && topic.links.length > 0 && (
                              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", marginBottom: hasNote ? "8px" : "0" }}>
                                {topic.links.map(l => (
                                  <a key={l.url} href={l.url} target="_blank" rel="noopener noreferrer" className="link-pill">
                                    <span style={{ opacity: 0.7 }}>🔗</span> {l.title}
                                  </a>
                                ))}
                              </div>
                            )}

                            {/* Note Snippet */}
                            {hasNote && (
                              <div style={{ fontSize: "11px", color: "#6B7280", borderLeft: `2px solid ${activePhase.accent}55`, paddingLeft: "10px", lineHeight: "1.4", fontStyle: "italic", whiteSpace: "pre-wrap", background: "#050508", padding: "6px 10px", borderRadius: "0 4px 4px 0" }}>
                                {state.notes[topic.id]}
                              </div>
                            )}
                          </div>
                          
                          {/* Edit Note Button */}
                          <button
                            onClick={() => { setNoteModal(topic.id); setNoteText(state.notes[topic.id] || ""); }}
                            style={{ background: "none", border: "none", color: hasNote ? activePhase.accent : "#2D3748", fontSize: "14px", cursor: "pointer", padding: "4px", flexShrink: 0, transition: "color 0.2s" }}
                          >✎</button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}

          {/* STATS VIEW */}
          {view === "stats" && (
            <div style={{ padding: "20px 18px" }}>
              <div className="stats-grid">
                <div style={{ textAlign: "center", padding: "36px 20px 28px", background: "#070A12", borderRadius: "10px", border: "1px solid #0F1629", position: "relative", overflow: "hidden" }}>
                  <div style={{ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 50% 50%, rgba(57,255,20,0.06) 0%, transparent 70%)", pointerEvents: "none" }}></div>
                  <div style={{ fontSize: "64px", fontWeight: "900", color: "#39FF14", lineHeight: 1, fontFamily: "Georgia, serif" }}>{pct}<span style={{ fontSize: "28px" }}>%</span></div>
                  <div style={{ fontSize: "10px", color: "#4A5568", letterSpacing: "2px", marginTop: "4px" }}>OVERALL COMPLETION</div>
                  
                  <div style={{ marginTop: "16px", display: "flex", justifyContent: "center", gap: "24px" }}>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: "20px", fontWeight: "bold", color: "#FF4444" }}>{criticalDone}/{criticalTotal}</div>
                      <div style={{ fontSize: "9px", color: "#4A5568", letterSpacing: "1px" }}>CRITICAL</div>
                    </div>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: "20px", fontWeight: "bold", color: "#E2E8F0" }}>{totalDone}/{allTopics.length}</div>
                      <div style={{ fontSize: "9px", color: "#4A5568", letterSpacing: "1px" }}>TOTAL</div>
                    </div>
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "12px", marginTop: window.innerWidth < 768 ? "18px" : "0" }}>PHASE BREAKDOWN</div>
                  {PHASES.map(ph => {
                    const s = phaseStats(ph);
                    return (
                      <div key={ph.id} style={{ marginBottom: "10px", padding: "13px 14px", background: "#070A12", borderRadius: "6px", border: "1px solid #0F1629" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "7px" }}>
                          <div>
                            <span style={{ fontSize: "9px", color: ph.accent, letterSpacing: "1px", marginRight: "8px" }}>{ph.code}</span>
                            <span style={{ fontSize: "13px", fontFamily: "Georgia, serif" }}>{ph.title}</span>
                          </div>
                          <span style={{ fontSize: "11px", color: ph.accent }}>{s.done}/{s.total}</span>
                        </div>
                        <div style={{ background: "#0D1117", height: "4px", borderRadius: "2px", overflow: "hidden" }}>
                          <div style={{ height: "100%", width: `${s.pct}%`, background: ph.accent, borderRadius: "2px", transition: "width 0.5s ease" }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                
                {/* Clear Progress Button added back */}
                <div style={{ marginTop: "32px", textAlign: "center", gridColumn: "1 / -1" }}>
                  <button onClick={handleReset} style={{ background: "transparent", color: "#FF4444", border: "1px solid #FF444430", padding: "10px 16px", borderRadius: "6px", fontSize: "10px", letterSpacing: "1px", cursor: "pointer" }}>
                    CLEAR ALL PROGRESS
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CAREERS VIEW */}
          {view === "guide" && (
            <div style={{ padding: "20px 18px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "14px" }}>CAREER TRACKS</div>
              
              <div className="job-grid">
                {[
                  { title: "AI Full-Stack Developer", color: "#C084FC", focus: "Top Demand", must: ["Vercel AI SDK", "FastAPI / Next.js", "RAG Integration"], note: "Combine your frontend/backend skills with AI APIs to build complete user-facing AI products." },
                  { title: "AI Agentic Architect", color: "#FFD700", focus: "Enterprise", must: ["LangGraph / CrewAI", "MCP Integrations", "Advanced Orchestration"], note: "Focus strictly on Phase 4. Companies want developers who can build reliable multi-agent systems." },
                  { title: "Data & RAG Engineer", color: "#00D4FF", focus: "Backend/Data", must: ["Vector DBs", "GraphRAG", "Data Pipelines (DSPy)"], note: "Specialize in making LLMs smart on private company data without hallucinating." },
                ].map(tier => (
                  <div key={tier.title} style={{ padding: "16px", background: "#070A12", borderRadius: "8px", border: `1px solid ${tier.color}30` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "10px" }}>
                      <div style={{ fontSize: "13px", fontFamily: "Georgia, serif", fontWeight: "bold" }}>{tier.title}</div>
                      <div style={{ fontSize: "11px", color: tier.color }}>{tier.focus}</div>
                    </div>
                    <div style={{ fontSize: "9px", letterSpacing: "2px", color: "#4A5568", marginBottom: "6px" }}>MUST KNOW</div>
                    {tier.must.map(item => (
                      <div key={item} style={{ fontSize: "11px", color: "#94A3B8", marginBottom: "3px", display: "flex", alignItems: "center", gap: "6px" }}>
                        <span style={{ color: tier.color, fontSize: "8px" }}>▸</span> {item}
                      </div>
                    ))}
                    <div style={{ marginTop: "10px", padding: "8px 10px", background: tier.color + "0d", borderLeft: `2px solid ${tier.color}`, fontSize: "10px", color: "#6B7280", lineHeight: "1.4" }}>
                      💡 {tier.note}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* NOTE MODAL */}
          {noteModal && (
            <div
              className="modal-overlay"
              onClick={e => e.target === e.currentTarget && setNoteModal(null)}
            >
              <div className="modal-content">
                <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "12px" }}>ADD NOTE</div>
                <textarea
                  autoFocus
                  value={noteText}
                  onChange={e => setNoteText(e.target.value)}
                  placeholder="Resources found, key concepts, questions to revisit..."
                  style={{ width: "100%", minHeight: "150px", background: "#0D1117", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#E2E8F0", padding: "12px", fontSize: "13px", fontFamily: "'Courier New', monospace", resize: "none", lineHeight: "1.5" }}
                />
                <div style={{ display: "flex", gap: "10px", marginTop: "12px" }}>
                  <button onClick={() => setNoteModal(null)} style={{ flex: 1, padding: "12px", background: "transparent", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#4A5568", cursor: "pointer", fontSize: "12px", transition: "background 0.2s" }}>CANCEL</button>
                  <button onClick={saveNote} style={{ flex: 2, padding: "12px", background: "#39FF14", border: "none", borderRadius: "6px", color: "#050508", cursor: "pointer", fontSize: "12px", fontWeight: "900", transition: "opacity 0.2s" }}>SAVE NOTE</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
