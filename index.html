    </div>
  </div>

  <script>
    // Error Catcher - displays the error on screen if the app crashes
    window.addEventListener('error', function(event) {
      document.getElementById('root').innerHTML = `
        <div class="flex flex-col items-center justify-center h-screen text-center p-5">
          <div class="text-red-500 mb-4"><svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg></div>
          <h2 class="text-xl font-bold text-white mb-2">App Crashed</h2>
          <p class="text-red-400 text-sm border border-red-900 bg-red-950/30 p-3 rounded text-left break-words w-full max-w-md">${event.message}</p>
        </div>
      `;
    });
  </script>

  <script type="text/babel" data-presets="react">

    const firebaseConfig = {

          "Study Chain-of-Thought (CoT) to force step-by-step reasoning.",

      },
      {
        id: "p7",
        title: "Phase 07: Multi-Agent Systems (Weeks 18-24)",
        goal: "Build Swarms of Cooperating AI Agents.",
        tasks: [
          "Understand multi-agent topologies (Hierarchical, Sequential, Joint).",
          "Build systems with CrewAI (Roles, Tasks, Crews).",
          "Explore Microsoft AutoGen for conversational agent workflows.",
          "Implement LangGraph for stateful, cyclical agent apps.",
          "Handle agent-to-agent communication and conflict resolution."
        ],
        resources: [
          "CrewAI Tutorial: https://www.youtube.com/results?search_query=CrewAI+Tutorial",
          "LangGraph Introduction: https://www.youtube.com/results?search_query=LangGraph+Introduction",
          "Microsoft AutoGen: https://www.youtube.com/results?search_query=Microsoft+AutoGen+Tutorial"
        ]
      },
      {
        id: "p8",
        title: "Phase 08: Evaluation & Observability (Weeks 22-28)",
        goal: "Measure Agent Performance and Stop Hallucinations.",
        tasks: [
          "Implement LLM observability with LangSmith or Phoenix.",
          "Trace agent execution paths and token usage.",
          "Build automated evaluation suites (LLM-as-a-judge).",
          "Test agent tool-use accuracy and failure rates.",
          "Establish red-teaming protocols for agent safety."
        ],
        resources: [
          "Evaluating LLMs: https://www.youtube.com/results?search_query=Evaluating+LLMs",
          "LangSmith Tutorial: https://www.youtube.com/results?search_query=LangSmith+Tutorial"
        ]
      },
      {
        id: "p9",
        title: "Phase 09: Advanced Architectures (Weeks 26-32)",
        goal: "State-of-the-art Cognitive Architectures.",
        tasks: [
          "Implement Plan-and-Solve architectures.",
          "Build Reflexion agents (Self-correction loops).",
          "Implement Tree of Thoughts (ToT) for complex planning.",
          "Handle async background agent processing (Celery/Redis)."
        ],
        resources: [
          "Cognitive Architectures for LLMs: https://www.youtube.com/results?search_query=Cognitive+Architectures+for+LLMs",
          "Reflexion and Self-Correction: https://www.youtube.com/results?search_query=LLM+Reflexion"
        ]
      },
      {
        id: "p10",
        title: "Phase 10: Deployment & Production (Weeks 30-36)",
        goal: "Ship Agents to Production Safely.",
        tasks: [
          "Wrap agents in FastAPI for production endpoints.",
          "Containerize agent systems with Docker.",
          "Implement streaming responses (Server-Sent Events) for UX.",
          "Handle rate limits, retries, and API fallbacks.",
          "Deploy to cloud platforms (AWS, Render, GCP)."
        ],
        resources: [
          "FastAPI Crash Course: https://www.youtube.com/results?search_query=FastAPI+Crash+Course",
          "Docker for AI Apps: https://www.youtube.com/results?search_query=Docker+for+Machine+Learning"
        ]
      },
      {
        id: "p11",
        title: "Phase 11: End-to-End Capstone (Weeks 35-40)",
        goal: "Build a Production-Grade Autonomous System.",
        tasks: [
          "Select a high-value use case (e.g., Devin clone, Automated Researcher).",
          "Design system architecture (Frontend, Backend DB, Agent Graph).",
          "Implement comprehensive logging and fail-safes.",
          "Deploy publicly and write a technical case study.",
          "Open source the code on GitHub for your portfolio."
        ],
        resources: [
          "Building AI Startups: https://www.youtube.com/results?search_query=Building+AI+Startups"
        ]
      }
    ];

    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [roadmapData, setRoadmapData] = useState(INITIAL_ROADMAP);
      const [progress, setProgress] = useState({});
      const [notes, setNotes] = useState({});
      const [customLinks, setCustomLinks] = useState({}); 
      
      const [loading, setLoading] = useState(true);
      const [currentView, setCurrentView] = useState('dashboard'); 
      const [isEditingMode, setIsEditingMode] = useState(false);
      
      const [linkModalOpen, setLinkModalOpen] = useState(false);
      const [activeTaskKey, setActiveTaskKey] = useState(null);
      const [newLink, setNewLink] = useState({ title: '', url: '' });

      const [newTaskText, setNewTaskText] = useState("");
      const [newResourceText, setNewResourceText] = useState("");

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            fetchUserData(currentUser.uid);
          } else {
            setUser(null);
            setProgress({});
            setNotes({});
            setCustomLinks({});
            setRoadmapData(INITIAL_ROADMAP);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const fetchUserData = async (uid) => {
        try {
          const doc = await db.collection("users").doc(uid).get();
          if (doc.exists) {
            const data = doc.data();
            setProgress(data.progress || {});
            setNotes(data.notes || {});
            setCustomLinks(data.customLinks || {});
            if (data.roadmapData && data.roadmapData.length > 0) {
              setRoadmapData(data.roadmapData);
            } else {
              setRoadmapData(INITIAL_ROADMAP);
            }
          }
        } catch (error) { console.error("Error fetching data:", error); }
        setLoading(false);
      };

      const syncToFirebase = (key, data) => {
        if (!user) return;
        db.collection("users").doc(user.uid).set({ [key]: data }, { merge: true })
          .catch(err => console.error("Sync error:", err));
      };

      const saveRoadmap = (newData) => {
        setRoadmapData(newData);
        if (user) syncToFirebase('roadmapData', newData);
      };

      const handleAddPhase = () => {
        const newPhase = {
          id: `p${Date.now()}`,
          title: "New Custom Phase",
          goal: "Click to edit goal...",
          tasks: ["Sample Task - click to edit or delete"],
          resources: []
        };
        saveRoadmap([...roadmapData, newPhase]);
      };

      const handleDeletePhase = (id, e) => {
        e.stopPropagation();
        if(confirm("Are you sure you want to delete this entire phase?")) {
          saveRoadmap(roadmapData.filter(p => p.id !== id));
        }
      };

      const updatePhaseField = (id, field, value) => {
        saveRoadmap(roadmapData.map(p => p.id === id ? { ...p, [field]: value } : p));
      };

      const addTask = (phaseId) => {
        if(!newTaskText.trim()) return;
        saveRoadmap(roadmapData.map(p => p.id === phaseId ? {...p, tasks: [...p.tasks, newTaskText]} : p));
        setNewTaskText("");
      };

      const removeTask = (phaseId, taskIndex) => {
        saveRoadmap(roadmapData.map(p => {
          if(p.id === phaseId) {
            const updated = [...p.tasks];
            updated.splice(taskIndex, 1);
            return {...p, tasks: updated};
          }
          return p;
        }));
      };

      const addResource = (phaseId) => {
        if(!newResourceText.trim()) return;
        saveRoadmap(roadmapData.map(p => p.id === phaseId ? {...p, resources: [...p.resources, newResourceText]} : p));
        setNewResourceText("");
      };

      const removeResource = (phaseId, resIndex) => {
        saveRoadmap(roadmapData.map(p => {
          if(p.id === phaseId) {
            const updated = [...p.resources];
            updated.splice(resIndex, 1);
            return {...p, resources: updated};
          }
          return p;
        }));
      };

      const toggleTask = (weekId, taskIndex) => {
        if (!user) return alert("Please sign in to track progress.");
        const key = `${weekId}-${taskIndex}`;
        const newProgress = { ...progress, [key]: !progress[key] };
        setProgress(newProgress);
        syncToFirebase('progress', newProgress);
      };

      const updateNote = (weekId, value) => {
        if (!user) return;
        const newNotes = { ...notes, [weekId]: value };
        setNotes(newNotes);
        syncToFirebase('notes', newNotes);
      };

      const handleAddCustomLink = (e) => {
        e.preventDefault();
        if (!user) return alert("Sign in to add links.");
        if (!newLink.url.startsWith('http')) newLink.url = 'https://' + newLink.url;
        
        const existingLinks = customLinks[activeTaskKey] || [];
        const newCustomLinksState = { ...customLinks, [activeTaskKey]: [...existingLinks, newLink] };
        setCustomLinks(newCustomLinksState);
        syncToFirebase('customLinks', newCustomLinksState);
        setLinkModalOpen(false);
        setNewLink({ title: '', url: '' });
      };

      const handleDeleteCustomLink = (taskKey, linkIndex) => {
        const existingLinks = [...(customLinks[taskKey] || [])];
        existingLinks.splice(linkIndex, 1);
        const newCustomLinksState = { ...customLinks, [taskKey]: existingLinks };
        setCustomLinks(newCustomLinksState);
        syncToFirebase('customLinks', newCustomLinksState);
      };

      const handleSignIn = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const handleSignOut = () => auth.signOut();

      const totalTasks = roadmapData.reduce((acc, w) => acc + w.tasks.length, 0);
      
      let completedTasks = 0;
      roadmapData.forEach(phase => {
        phase.tasks.forEach((_, i) => {
          if (progress[`${phase.id}-${i}`]) completedTasks++;
        });
      });
      
      const overallPercent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

      const getPhaseStats = (phaseId, taskCount) => {
        if(taskCount === 0) return { done: 0, total: 0, percent: 0 };
        const done = Array.from({length: taskCount}).filter((_, i) => progress[`${phaseId}-${i}`]).length;
        return { done, total: taskCount, percent: Math.round((done / taskCount) * 100) };
      };

      const formatUrl = (text) => {
        const parts = text.split(/(https?:\/\/[^\s]+)/g);
        return parts.map((part, i) => part.startsWith('http') ? 
          <a key={i} href={part} target="_blank" rel="noreferrer" className="text-emerald-400 hover:text-emerald-300 hover:underline break-all inline-block">{part}</a> 
          : <span key={i}>{part}</span>
        );
      };

      return (
        <div className="min-h-screen flex flex-col">
          <nav className="glass-nav sticky top-0 z-40 px-4 py-3 sm:px-6 shadow-md">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-4">
                {currentView !== 'dashboard' && (
                  <button onClick={() => setCurrentView('dashboard')} className="p-2 -ml-2 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                  </button>
                )}
                <div>
                  <h1 className="text-lg sm:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">Agentic AI Blueprint</h1>
                  <p className="text-xs text-gray-400 hidden sm:block">2026 Edition</p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <button 
                  onClick={() => setIsEditingMode(!isEditingMode)}
                  className={`text-xs px-3 py-1.5 rounded-md transition-colors border ${isEditingMode ? 'bg-emerald-600/20 text-emerald-400 border-emerald-500/50' : 'bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-700'}`}
                >
                  {isEditingMode ? 'Finish Editing' : 'Edit Roadmap'}
                </button>

                {loading ? <span className="text-xs text-gray-500">...</span> : user ? (
                  <div className="flex items-center gap-3 border-l border-gray-800 pl-4">
                    <img src={user.photoURL || 'https://via.placeholder.com/32'} alt="avatar" className="w-8 h-8 rounded-full border border-gray-700" />
                    <button onClick={handleSignOut} className="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-md transition-colors border border-gray-700 hidden sm:block">Logout</button>
                  </div>
                ) : (
                  <button onClick={handleSignIn} className="text-sm bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-md transition-colors">Sign In</button>
                )}
              </div>
            </div>
          </nav>

          <main className="flex-1 w-full max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
            
            {currentView === 'dashboard' && (
              <div className="fade-in space-y-8">
                <div className="bg-gradient-to-br from-gray-900 to-gray-950 p-6 sm:p-8 rounded-2xl border border-gray-800 shadow-xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-32 bg-emerald-500/5 rounded-full blur-3xl"></div>
                  <div className="relative z-10 flex flex-col md:flex-row items-center gap-8">
                    <div className="relative w-32 h-32 flex items-center justify-center rounded-full bg-gray-800 shrink-0" 
                         style={{ background: `conic-gradient(#10b981 ${overallPercent}%, #1f2937 ${overallPercent}%)` }}>
                      <div className="absolute w-28 h-28 bg-gray-950 rounded-full flex flex-col items-center justify-center">
                        <span className="text-3xl font-bold text-white">{overallPercent}%</span>
                      </div>
                    </div>
                    <div className="flex-1 text-center md:text-left">
                      <h2 className="text-2xl font-bold text-white mb-2">Architect Autonomous Systems</h2>
                      <p className="text-gray-400 text-sm mb-4">You have completed <strong className="text-emerald-400">{completedTasks}</strong> out of <strong className="text-gray-300">{totalTasks}</strong> tasks. You can modify this roadmap anytime to fit your exact learning path.</p>
                    </div>
                  </div>
                </div>

                <div>
                  <h3 className="text-lg font-bold text-gray-200 mb-4 px-1">Curriculum Phases</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {roadmapData.map((phase) => {
                      const stats = getPhaseStats(phase.id, phase.tasks.length);
                      const isCompleted = stats.done === stats.total && stats.total > 0;
                      
                      return (
                        <div 
                          key={phase.id} 
                          onClick={() => !isEditingMode && setCurrentView(phase.id)}
                          className={`group relative bg-gray-900 p-5 rounded-xl border ${isCompleted ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-gray-800'} ${!isEditingMode && 'cursor-pointer hover:border-gray-600 hover:-translate-y-1'} transition-all shadow-md`}
                        >
                          {isEditingMode && (
                            <button onClick={(e) => handleDeletePhase(phase.id, e)} className="absolute -top-2 -right-2 bg-red-500 text-white p-1.5 rounded-full shadow-lg hover:bg-red-400 z-10">
                              <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                          )}
                          <div className="flex justify-between items-start mb-3">
                            <h4 className="font-bold text-gray-100 group-hover:text-emerald-400 transition-colors pr-4">{phase.title.split(':')[0]}</h4>
                            {isCompleted ? 
                              <span className="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded border border-emerald-500/30 shrink-0">DONE</span> : 
                              <span className="text-xs font-mono text-gray-500 shrink-0">{stats.done}/{stats.total}</span>
                            }
                          </div>
                          <p className="text-xs text-gray-400 line-clamp-2 mb-4 h-8">{phase.title.split(':')[1]?.trim() || phase.title}</p>
                          
                          <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mb-2">
                            <div className={`h-full rounded-full transition-all duration-500 ${isCompleted ? 'bg-emerald-500' : 'bg-cyan-500'}`} style={{ width: `${stats.percent}%` }}></div>
                          </div>
                          
                          {isEditingMode && (
                            <button onClick={() => setCurrentView(phase.id)} className="w-full mt-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-700 transition-colors">
                              Edit Content Inside
                            </button>
                          )}
                        </div>
                      );
                    })}
                    
                    {isEditingMode && (
                      <div onClick={handleAddPhase} className="cursor-pointer bg-gray-900/50 border-2 border-dashed border-gray-700 hover:border-gray-500 hover:bg-gray-800 p-5 rounded-xl flex flex-col items-center justify-center text-gray-500 hover:text-gray-300 transition-all min-h-[160px]">
                        <svg className="w-8 h-8 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                        <span className="text-sm font-bold">Add New Phase</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {currentView !== 'dashboard' && roadmapData.filter(w => w.id === currentView).map(phase => {
              const stats = getPhaseStats(phase.id, phase.tasks.length);
              
              return (
                <div key={phase.id} className="fade-in max-w-4xl mx-auto space-y-6">
                  
                  <div className="bg-gray-900 p-6 sm:p-8 rounded-2xl border border-gray-800 shadow-lg relative">
                    {isEditingMode ? (
                      <div className="space-y-3 mb-6 pr-12">
                        <input 
                          value={phase.title} 
                          onChange={(e) => updatePhaseField(phase.id, 'title', e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 rounded p-2 text-2xl font-bold text-white focus:border-emerald-500 focus:outline-none"
                          placeholder="Phase Title..."
                        />
                        <textarea 
                          value={phase.goal} 
                          onChange={(e) => updatePhaseField(phase.id, 'goal', e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-cyan-400 focus:border-emerald-500 focus:outline-none resize-none"
                          placeholder="Phase Goal / Description..."
                          rows="2"
                        />
                      </div>
                    ) : (
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-6">
                        <div>
                          <h2 className="text-3xl font-bold text-white mb-2">{phase.title}</h2>
                          <p className="text-cyan-400 font-medium">{phase.goal}</p>
                        </div>
                        <div className="text-right shrink-0">
                          <span className="text-3xl font-bold text-white">{stats.percent}%</span>
                          <span className="text-sm text-gray-500 block">Completed</span>
                        </div>
                      </div>
                    )}
                    
                    {!isEditingMode && (
                      <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                        <div className="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full transition-all duration-500" style={{ width: `${stats.percent}%` }}></div>
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <div className="lg:col-span-2 space-y-4">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 px-1">Action Items</h3>
                      <div className="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden divide-y divide-gray-800">
                        {phase.tasks.map((task, index) => {
                          const taskKey = `${phase.id}-${index}`;
                          const isChecked = !!progress[taskKey];
                          const taskLinks = customLinks[taskKey] || [];

                          return (
                            <div key={index} className={`p-4 transition-colors ${isChecked && !isEditingMode ? 'bg-gray-900/40' : 'hover:bg-gray-800/50'} relative group`}>
                              
                              {isEditingMode && (
                                <button onClick={() => removeTask(phase.id, index)} className="absolute top-4 right-4 text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                              )}

                              <label className="flex items-start gap-4 cursor-pointer mb-2 pr-8">
                                {!isEditingMode && (
                                  <div className="mt-0.5 relative flex shrink-0">
                                    <input type="checkbox" checked={isChecked} onChange={() => toggleTask(phase.id, index)} className="peer sr-only" />
                                    <div className="w-5 h-5 border-2 border-gray-600 rounded bg-gray-800 peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all"></div>
                                    {isChecked && <svg className="absolute w-3.5 h-3.5 text-white top-[3px] left-[3px] pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>}
                                  </div>
                                )}
                                
                                {isEditingMode ? (
                                  <textarea 
                                    value={task}
                                    onChange={(e) => {
                                      const newTasks = [...phase.tasks];
                                      newTasks[index] = e.target.value;
                                      updatePhaseField(phase.id, 'tasks', newTasks);
                                    }}
                                    className="flex-1 bg-gray-950 border border-gray-800 rounded p-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500 resize-none"
                                    rows="2"
                                  />
                                ) : (
                                  <span className={`text-base leading-relaxed transition-colors ${isChecked ? 'text-gray-500 line-through' : 'text-gray-200'}`}>
                                    {task}
                                  </span>
                                )}
                              </label>

                              {!isEditingMode && (
                                <div className="pl-9 space-y-2">
                                  {taskLinks.map((link, lIndex) => (
                                    <div key={lIndex} className="flex items-center gap-2 text-sm bg-gray-950 p-2 rounded border border-gray-800 group/link">
                                      <svg className="w-4 h-4 text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                                      <a href={link.url} target="_blank" rel="noreferrer" className="text-emerald-400 hover:underline flex-1 truncate">{link.title || link.url}</a>
                                      <button onClick={() => handleDeleteCustomLink(taskKey, lIndex)} className="text-gray-600 hover:text-red-400 p-1 opacity-0 group-hover/link:opacity-100 transition-opacity">
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                      </button>
                                    </div>
                                  ))}
                                  
                                  <button onClick={() => { setActiveTaskKey(taskKey); setLinkModalOpen(true); }} className="text-xs text-gray-500 hover:text-emerald-400 flex items-center gap-1 mt-1 transition-colors">
                                    <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                    Add Resource Link
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })}
                        
                        {isEditingMode && (
                          <div className="p-4 bg-gray-900/50 flex gap-2">
                            <input 
                              type="text" 
                              value={newTaskText}
                              onChange={(e) => setNewTaskText(e.target.value)}
                              placeholder="Type a new task here..."
                              className="flex-1 bg-gray-950 border border-gray-800 rounded p-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500"
                              onKeyDown={(e) => e.key === 'Enter' && addTask(phase.id)}
                            />
                            <button onClick={() => addTask(phase.id)} className="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 rounded text-sm transition-colors">Add</button>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="space-y-6">
                      <div>
                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 px-1 mb-3">Curriculum Resources</h3>
                        <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">
                          {phase.resources.map((res, i) => (
                            <div key={i} className="text-sm text-gray-300 pb-3 border-b border-gray-800 last:border-0 last:pb-0 relative group">
                              {isEditingMode ? (
                                <div className="flex gap-2">
                                  <input 
                                    value={res} 
                                    onChange={(e) => {
                                      const updated = [...phase.resources];
                                      updated[i] = e.target.value;
                                      updatePhaseField(phase.id, 'resources', updated);
                                    }}
                                    className="flex-1 bg-gray-950 border border-gray-800 rounded p-1.5 text-xs text-gray-200 focus:outline-none focus:border-emerald-500"
                                  />
                                  <button onClick={() => removeResource(phase.id, i)} className="text-red-400 hover:text-red-300 px-2 bg-red-500/10 rounded"><svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                                </div>
                              ) : formatUrl(res)}
                            </div>
                          ))}
                          
                          {isEditingMode && (
                            <div className="flex gap-2 pt-2">
                              <input 
                                type="text" 
                                value={newResourceText}
                                onChange={(e) => setNewResourceText(e.target.value)}
                                placeholder="Add resource URL..."
                                className="flex-1 bg-gray-950 border border-gray-800 rounded p-1.5 text-xs text-gray-200 focus:outline-none focus:border-emerald-500"
                                onKeyDown={(e) => e.key === 'Enter' && addResource(phase.id)}
                              />
                              <button onClick={() => addResource(phase.id)} className="bg-gray-800 text-gray-300 px-3 rounded text-xs hover:bg-gray-700">+</button>
                            </div>
                          )}
                        </div>
                      </div>

                      {!isEditingMode && (
                        <div className="flex flex-col h-64 lg:h-[calc(100%-200px)]">
                          <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 px-1 mb-3">My Phase Notes</h3>
                          <textarea
                            value={notes[phase.id] || ""}
                            onChange={(e) => updateNote(phase.id, e.target.value)}
                            placeholder="Jot down commands, setup issues, or specific agentic concepts to review..."
                            className="flex-1 w-full bg-gray-900 border border-gray-800 rounded-xl p-4 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-emerald-500 resize-none shadow-inner"
                          ></textarea>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </main>
          
          {linkModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fade-in">
              <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">Attach Personal Resource</h3>
                <form onSubmit={handleAddCustomLink} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1">Title / Description</label>
                    <input 
                      type="text" required value={newLink.title} 
                      onChange={e => setNewLink({...newLink, title: e.target.value})}
                      placeholder="e.g. Awesome Local LLM Setup"
                      className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm text-gray-200 focus:border-emerald-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1">URL Link</label>
                    <input 
                      type="url" required value={newLink.url} 
                      onChange={e => setNewLink({...newLink, url: e.target.value})}
                      placeholder="https://..."
                      className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm text-gray-200 focus:border-emerald-500 focus:outline-none"
                    />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setLinkModalOpen(false)} className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-lg text-sm font-medium transition-colors">Cancel</button>
                    <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-sm font-medium transition-colors">Save Link</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
