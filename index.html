        ],
        resources: [
          "Prompt Engineer Jobs: https://promptengineerjobs.com/",
          "Upwork Al Jobs: https://www.upwork.com/freelance-jobs/ai/",

        ]

    const { useState, useEffect, useCallback } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [progress, setProgress] = useState({});
      const [notes, setNotes] = useState({});
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            fetchUserData(currentUser.uid);
          } else {
            setUser(null);
            setProgress({});
            setNotes({});
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const fetchUserData = async (uid) => {
        try {
          const docRef = db.collection("users").doc(uid);
          const doc = await docRef.get();
          if (doc.exists) {
            const data = doc.data();
            setProgress(data.progress || {});
            setNotes(data.notes || {});
          }
        } catch (error) {
          console.error("Error fetching data: ", error);
        }
        setLoading(false);
      };

      const toggleTask = (weekId, taskIndex) => {
        if (!user) return alert("Please sign in to track progress.");
        const key = `${weekId}-${taskIndex}`;
        const updatedProgress = { ...progress, [key]: !progress[key] };
        setProgress(updatedProgress);
        db.collection("users").doc(user.uid).set({ progress: updatedProgress }, { merge: true });
      };

      const updateNote = (weekId, value) => {
        if (!user) return alert("Please sign in to save notes.");
        const updatedNotes = { ...notes, [weekId]: value };
        setNotes(updatedNotes);
        db.collection("users").doc(user.uid).set({ notes: updatedNotes }, { merge: true });
      };

      const handleSignIn = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const handleSignOut = () => auth.signOut();

      const calculateTotalProgress = () => {
        const totalTasks = ROADMAP_DATA.reduce((acc, week) => acc + week.tasks.length, 0);
        const completedTasks = Object.values(progress).filter(Boolean).length;
        return totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
          <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-800 pb-6 mb-8">
            <div>
              <h1 className="text-3xl font-bold text-white mb-2">16-Week Gen AI Roadmap</h1>
              <p className="text-gray-400">Track your journey to becoming a Gen AI Expert</p>
            </div>
            <div className="mt-4 sm:mt-0">
              {loading ? (
                <span className="text-gray-500">Loading...</span>
              ) : user ? (
                <div className="flex items-center gap-4">
                  <span className="text-sm text-green-400 font-mono">Syncing as {user.email}</span>
                  <button onClick={handleSignOut} className="px-4 py-2 text-sm bg-gray-800 hover:bg-gray-700 rounded transition-colors">Sign Out</button>
                </div>
              ) : (
                <button onClick={handleSignIn} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition-colors shadow-lg shadow-blue-900/20">
                  Sign in with Google
                </button>
              )}
            </div>
          </header>

          <div className="bg-gray-900 p-6 rounded-xl border border-gray-800 mb-8 shadow-sm">
            <div className="flex justify-between items-end mb-2">
              <span className="text-sm font-semibold uppercase tracking-wider text-gray-400">Overall Completion</span>
              <span className="text-2xl font-bold text-blue-400">{calculateTotalProgress()}%</span>
            </div>
            <div className="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden">
              <div className="bg-blue-500 h-2.5 rounded-full transition-all duration-500 ease-out" style={{ width: `${calculateTotalProgress()}%` }}></div>
            </div>
          </div>

          <div className="space-y-6">
            {ROADMAP_DATA.map((week) => {
              const weekTasksCompleted = week.tasks.filter((_, i) => progress[`${week.id}-${i}`]).length;
              const isWeekComplete = weekTasksCompleted === week.tasks.length;

              return (
                <div key={week.id} className={`bg-gray-900 rounded-xl border ${isWeekComplete ? 'border-green-500/30' : 'border-gray-800'} overflow-hidden shadow-sm transition-colors`}>
                  <div className="p-5 border-b border-gray-800 bg-gray-900/50">
                    <h2 className="text-xl font-bold text-white mb-1">{week.title}</h2>
                    <p className="text-sm text-blue-400 font-medium">{week.goal}</p>
                  </div>
                  <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                      <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 mb-4">Tasks</h3>
                      <div className="space-y-3">
                        {week.tasks.map((task, index) => {
                          const isChecked = !!progress[`${week.id}-${index}`];
                          return (
                            <label key={index} className="flex items-start gap-3 cursor-pointer group">
                              <div className="mt-0.5 relative flex items-center justify-center">
                                <input type="checkbox" checked={isChecked} onChange={() => toggleTask(week.id, index)} className="peer sr-only" />
                                <div className="w-5 h-5 border-2 border-gray-600 rounded bg-gray-800 peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-colors"></div>
                                {isChecked && (
                                  <svg className="absolute w-3 h-3 text-white pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                  </svg>
                                )}
                              </div>
                              <span className={`text-sm leading-relaxed transition-colors ${isChecked ? 'text-gray-500 line-through' : 'text-gray-300 group-hover:text-white'}`}>{task}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                    <div className="flex flex-col gap-6">
                      <div>
                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 mb-4">Resources</h3>
                        <ul className="space-y-2">
                          {week.resources.map((res, i) => {
                            const parts = res.split(/(https?:\/\/[^\s]+)/g);
                            return (
                              <li key={i} className="text-sm text-gray-300 bg-gray-800/50 p-2.5 rounded border border-gray-700/50">
                                {parts.map((part, j) => part.startsWith('http') ? <a key={j} href={part} target="_blank" rel="noreferrer" className="text-blue-400 hover:text-blue-300 hover:underline break-all">{part}</a> : <span key={j}>{part}</span>)}
                              </li>
                            );
                          })}
                        </ul>
                      </div>
                      <div className="flex-1 flex flex-col">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500 mb-2">My Notes</h3>
                        <textarea value={notes[week.id] || ""} onChange={(e) => updateNote(week.id, e.target.value)} placeholder="Jot down key takeaways, commands, or thoughts..." className="flex-1 w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-y min-h-[100px]"></textarea>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
