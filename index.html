  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    /* Body background is darker to frame the app on desktop */
    body { background: #000000; color: #E2E8F0; font-family: 'Courier New', Courier, monospace; overscroll-behavior: none; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { display: none; }
    button { -webkit-appearance: none; touch-action: manipulation; }
    textarea { -webkit-appearance: none; outline: none; }
    
    /* Responsive App Container */
    .app-container {
      max-width: 800px;
      margin: 0 auto;
      background: #050508;
      min-height: 100vh;
      position: relative;
      border-left: 1px solid #0F1629;
      border-right: 1px solid #0F1629;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* Sync Badge */
    .sync-badge {
      font-size: 8px;
      padding: 3px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
    }
    .sync-local { background: #1A1F2E; color: #8888AA; }
    .sync-cloud { background: rgba(57, 255, 20, 0.1); color: #39FF14; border: 1px solid rgba(57, 255, 20, 0.3); }
    .sync-syncing { background: rgba(255, 215, 0, 0.1); color: #FFD700; border: 1px solid rgba(255, 215, 0, 0.3); }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 200;
    }
    .modal-content {
      width: 100%; max-width: 800px; background: #070A12; border-radius: 16px 16px 0 0; padding: 22px 18px 44px; border: 1px solid #0F1629; border-bottom: none; animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* Responsive Grids */
    .job-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .stats-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    
    @media (min-width: 768px) {
      .job-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      .stats-grid { grid-template-columns: 1fr 1fr; align-items: start; }
      .app-container { margin-top: 20px; margin-bottom: 20px; min-height: calc(100vh - 40px); border-radius: 12px; overflow: hidden; }
      .modal-overlay { align-items: center; }
      .modal-content { border-radius: 16px; border-bottom: 1px solid #0F1629; padding-bottom: 22px; }
    }
  </style>
</head>

        ]
      },
      {
        id: "p5", code: "05", title: "MLOps & Production AI",
        tag: "SENIOR REQUIREMENT", accent: "#FB7185",
        hiring: "Essential for mid-to-senior GenAI roles",
        topics: [
          { id: "p5t0", title: "LLMOps & Observability", priority: "CRITICAL", desc: "LangSmith, LangFuse, Helicone — tracing, logging, cost tracking, latency monitoring" },
          { id: "p5t1", title: "Hallucination & Safety", priority: "CRITICAL", desc: "Guardrails (Guardrails AI, NeMo), output validation, retry logic, content filtering" },
          { id: "p5t2", title: "Cloud AI Services", priority: "HIGH", desc: "AWS Bedrock, Azure OpenAI, GCP Vertex AI — managed LLM APIs, IAM, quotas" },
          { id: "p5t3", title: "Deployment Patterns", priority: "HIGH", desc: "FastAPI + Modal/Lambda, serverless inference, containerized GPU workloads, auto-scaling" },
          { id: "p5t4", title: "Caching & Optimization", priority: "HIGH", desc: "Semantic caching, prompt caching (Anthropic/OpenAI), Redis, cost reduction strategies" },

        tag: "DIFFERENTIATOR", accent: "#34D399",
        hiring: "Specializations command 20-40% salary premium",
        topics: [
          { id: "p6t0", title: "Voice AI Pipelines", priority: "HIGH", desc: "Whisper (STT), ElevenLabs/TTS, real-time streaming audio, WebRTC, sub-second latency" },
          { id: "p6t1", title: "Knowledge Graphs", priority: "HIGH", desc: "Neo4j, GraphRAG, combining graph traversal with vector search for complex reasoning" },
          { id: "p6t2", title: "Computer Vision + GenAI", priority: "HIGH", desc: "Stable Diffusion, DALL-E, image analysis with GPT-4o/Claude, YOLO + LLM pipelines" },
          { id: "p6t3", title: "Code Generation & DevTools", priority: "HIGH", desc: "Code agents, GitHub Copilot-style tools, AST manipulation, test generation" },

    const PRIORITY_META = {
      CRITICAL: { color: "#FF4444" },
      HIGH:     { color: "#FF9500" },
      MEDIUM:   { color: "#8888AA" },
    };

    const STORAGE_KEY = "genai_roadmap_v2";

    // ---------------------------------------------------------
    // 3. REACT APP COMPONENT
    // ---------------------------------------------------------
    const { useState, useEffect, useCallback } = React;

    function App() {
      const [state, setState] = useState({ done: {}, notes: {} });
      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("local"); 
      
      const [phase, setPhase] = useState(0);
      const [view, setView] = useState("map");
      const [noteModal, setNoteModal] = useState(null);
      const [noteText, setNoteText] = useState("");
      const [filterPriority, setFilterPriority] = useState("ALL");

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) setState(JSON.parse(raw));
        } catch (e) { console.error("Local storage error:", e); }
      }, []);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((usr) => {
          if (usr) {
            setUser(usr);
            setSyncStatus("syncing");
            const docRef = db.collection('users').doc(usr.uid);
            
            docRef.get().then((doc) => {
              if (doc.exists) {
                setState(doc.data());
                setSyncStatus("cloud");
              } else {
                const localRaw = localStorage.getItem(STORAGE_KEY);
                const localState = localRaw ? JSON.parse(localRaw) : { done: {}, notes: {} };
                docRef.set(localState);
                setState(localState);
                setSyncStatus("cloud");
              }
            }).catch(err => console.error("Error fetching data:", err));
          } else {
            setUser(null);
            setSyncStatus("local");
          }
        });
        return () => unsubscribe();
      }, []);

      const update = useCallback((nextState) => {
        setState(nextState);
        
        if (user) {
          setSyncStatus("syncing");
          db.collection('users').doc(user.uid).set(nextState, { merge: true })
            .then(() => setSyncStatus("cloud"))
            .catch(err => {
              console.error("Sync error:", err);
              setSyncStatus("local"); 
            });
        }
        
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState)); } catch {}
      }, [user]);

      const toggle = (id) => update({ ...state, done: { ...state.done, [id]: !state.done[id] } });
      
      const saveNote = () => {
        update({ ...state, notes: { ...state.notes, [noteModal]: noteText } });
        setNoteModal(null);
      };

      const handleLogin = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Login failed: " + err.message));
      };

      const handleLogout = () => auth.signOut();

      const handleReset = () => {
        if(confirm("Are you sure you want to clear all progress? This cannot be undone.")) {
            update({ done: {}, notes: {} });
        }
      };

      const allTopics = PHASES.flatMap(p => p.topics);
      const totalDone = allTopics.filter(t => state.done[t.id]).length;
      const pct = Math.round((totalDone / allTopics.length) * 100) || 0;
      
      const phaseStats = (ph) => {
        const done = ph.topics.filter(t => state.done[t.id]).length;
        return { done, total: ph.topics.length, pct: Math.round((done / ph.topics.length) * 100) || 0 };
      };
      
      const criticalDone = allTopics.filter(t => t.priority === "CRITICAL" && state.done[t.id]).length;
      const criticalTotal = allTopics.filter(t => t.priority === "CRITICAL").length;
      const activePhase = PHASES[phase];
      const filteredTopics = filterPriority === "ALL"
        ? activePhase.topics
        : activePhase.topics.filter(t => t.priority === filterPriority);

      return (
        <div className="app-container" style={{ paddingBottom: "88px" }}>

          {/* HEADER */}
          <div style={{ padding: "env(safe-area-inset-top, 24px) 18px 14px", paddingTop: "max(24px, env(safe-area-inset-top))", borderBottom: "1px solid #0F1629", position: "relative", overflow: "hidden", background: "#050508" }}>
            <div style={{ position: "absolute", inset: 0, backgroundImage: "linear-gradient(rgba(57,255,20,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,20,0.04) 1px, transparent 1px)", backgroundSize: "32px 32px", pointerEvents: "none" }}></div>
            
            <div style={{ position: "relative", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "4px", color: "#39FF14", marginBottom: "8px", display: "flex", alignItems: "center", gap: "6px" }}>
                  <span style={{ display: "inline-block", width: "6px", height: "6px", borderRadius: "50%", background: "#39FF14", boxShadow: "0 0 8px #39FF14" }}></span>
                  GENAI ROADMAP 2026
                </div>
                <div style={{ fontSize: "22px", fontWeight: "900", letterSpacing: "-0.5px", lineHeight: 1.1, fontFamily: "Georgia, serif" }}>
                  From Zero to <span style={{ color: "#39FF14" }}>Hired</span>
                </div>
              </div>
              
              {/* AUTH & SYNC WIDGET */}
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "8px" }}>
                {user ? (
                  <button onClick={handleLogout} style={{ fontSize: "10px", background: "none", border: "1px solid #1A1F2E", color: "#CBD5E0", padding: "4px 8px", borderRadius: "4px", cursor: "pointer" }}>
                    Log out
                  </button>
                ) : (
                  <button onClick={handleLogin} style={{ fontSize: "10px", background: "#fff", color: "#000", border: "none", padding: "4px 8px", borderRadius: "4px", cursor: "pointer", fontWeight: "bold", display: "flex", alignItems: "center", gap: "4px" }}>
                    <svg width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Sync
                  </button>
                )}
                <div className={`sync-badge sync-${syncStatus}`}>
                  {syncStatus === 'local' && "💾 Local"}
                  {syncStatus === 'syncing' && "↻ Syncing"}
                  {syncStatus === 'cloud' && "☁️ Synced"}
                </div>
              </div>
            </div>

            <div style={{ marginTop: "16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#4A5568", marginBottom: "5px" }}>
                <span>{totalDone}/{allTopics.length} topics · {criticalDone}/{criticalTotal} critical</span>
                <span style={{ color: "#39FF14" }}>{pct}% done</span>
              </div>
              <div style={{ background: "#0D1117", height: "5px", borderRadius: "2px", overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${pct}%`, background: "linear-gradient(90deg, #39FF14, #00D4FF)", transition: "width 0.6s cubic-bezier(0.4, 0, 0.2, 1)", boxShadow: pct > 0 ? "0 0 10px #39FF14" : "none" }}></div>
              </div>
            </div>
          </div>

          {/* NAV */}
          <div style={{ display: "flex", borderBottom: "1px solid #0F1629", position: "sticky", top: 0, background: "#050508", zIndex: 10 }}>
            {[["map","ROADMAP"],["stats","STATS"],["guide","JOB GUIDE"]].map(([v, label]) =>
              <button
                key={v} onClick={() => setView(v)}
                style={{ flex: 1, padding: "11px 4px", background: "none", border: "none", color: view === v ? "#39FF14" : "#2D3748", fontSize: "10px", letterSpacing: "2px", borderBottom: view === v ? "2px solid #39FF14" : "2px solid transparent", cursor: "pointer", transition: "color 0.2s" }}
              >{label}</button>
            )}
          </div>

          {/* ROADMAP VIEW */}
          {view === "map" && (
            <div>
              <div style={{ padding: "14px 18px 14px", display: "flex", gap: "8px", overflowX: "auto" }}>
                {PHASES.map((ph, i) => {
                  const s = phaseStats(ph);
                  const active = i === phase;
                  return (
                    <button
                      key={ph.id} onClick={() => setPhase(i)}
                      style={{ flexShrink: 0, padding: "7px 12px", border: `1px solid ${active ? ph.accent : "#1A1F2E"}`, borderRadius: "4px", background: active ? ph.accent + "18" : "transparent", color: active ? ph.accent : "#4A5568", fontSize: "10px", letterSpacing: "1px", cursor: "pointer", transition: "all 0.2s" }}
                    >
                      {ph.code} · {s.done}/{s.total}
                    </button>
                  );
                })}
              </div>

              <div style={{ padding: "0 18px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "6px" }}>
                  <div>
                    <div style={{ fontSize: "10px", color: activePhase.accent, letterSpacing: "3px", marginBottom: "3px" }}>PHASE {activePhase.code} · {activePhase.tag}</div>
                    <div style={{ fontSize: "18px", fontWeight: "bold", fontFamily: "Georgia, serif" }}>{activePhase.title}</div>
                  </div>
                  <div style={{ fontSize: "28px", fontWeight: "900", color: activePhase.accent, opacity: 0.15, fontFamily: "Georgia, serif" }}>{activePhase.code}</div>
                </div>
                <div style={{ fontSize: "10px", color: "#4A5568", marginBottom: "10px" }}>📊 {activePhase.hiring}</div>
                <div style={{ background: "#0D1117", height: "3px", borderRadius: "2px", overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${phaseStats(activePhase).pct}%`, background: activePhase.accent, transition: "width 0.5s cubic-bezier(0.4, 0, 0.2, 1)" }}></div>
                </div>
              </div>

              <div style={{ padding: "0 18px 12px", display: "flex", gap: "6px" }}>
                {["ALL","CRITICAL","HIGH","MEDIUM"].map(p =>
                  <button
                    key={p} onClick={() => setFilterPriority(p)}
                    style={{ padding: "4px 10px", border: `1px solid ${filterPriority === p ? (p === "ALL" ? "#39FF14" : PRIORITY_META[p].color) : "#1A1F2E"}`, borderRadius: "3px", background: "transparent", color: filterPriority === p ? (p === "ALL" ? "#39FF14" : PRIORITY_META[p].color) : "#2D3748", fontSize: "9px", letterSpacing: "1px", cursor: "pointer", transition: "all 0.2s" }}
                  >{p}</button>
                )}
              </div>

              <div style={{ padding: "0 18px" }}>
                {filteredTopics.map(topic => {
                  const done = state.done[topic.id];
                  const pm = PRIORITY_META[topic.priority];
                  const hasNote = !!state.notes[topic.id];
                  
                  return (
                    <div key={topic.id} style={{ marginBottom: "10px", border: `1px solid ${done ? activePhase.accent + "40" : "#0F1629"}`, borderRadius: "6px", background: done ? activePhase.accent + "08" : "#070A12", overflow: "hidden", transition: "all 0.25s ease" }}>
                      <div style={{ display: "flex", alignItems: "flex-start", padding: "13px 14px", gap: "12px" }}>
                        <button
                          onClick={() => toggle(topic.id)}
                          style={{ width: "20px", height: "20px", flexShrink: 0, border: `2px solid ${done ? activePhase.accent : "#1E2738"}`, borderRadius: "3px", background: done ? activePhase.accent : "transparent", cursor: "pointer", marginTop: "1px", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}
                        >
                          {done && <svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.5 6 8 1" stroke="#050508" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                        </button>
                        
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap", marginBottom: "4px" }}>
                            <span style={{ fontSize: "13px", fontWeight: "bold", color: done ? activePhase.accent : "#CBD5E0", textDecoration: done ? "line-through" : "none", opacity: done ? 0.65 : 1, fontFamily: "Georgia, serif" }}>{topic.title}</span>
                            <span style={{ fontSize: "8px", letterSpacing: "1.5px", padding: "2px 5px", border: `1px solid ${pm.color}33`, color: pm.color, borderRadius: "2px" }}>{topic.priority}</span>
                          </div>
                          <div style={{ fontSize: "11px", color: "#4A5568", lineHeight: "1.45" }}>{topic.desc}</div>
                          {hasNote && <div style={{ marginTop: "7px", fontSize: "10px", color: "#6B7280", borderLeft: `2px solid ${activePhase.accent}55`, paddingLeft: "8px", lineHeight: "1.4", fontStyle: "italic", whiteSpace: "pre-wrap" }}>{state.notes[topic.id]}</div>}
                        </div>
                        
                        <button
                          onClick={() => { setNoteModal(topic.id); setNoteText(state.notes[topic.id] || ""); }}
                          style={{ background: "none", border: "none", color: hasNote ? activePhase.accent : "#1E2738", fontSize: "14px", cursor: "pointer", padding: "2px", flexShrink: 0, transition: "color 0.2s" }}
                        >✎</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* STATS VIEW */}
          {view === "stats" && (
            <div style={{ padding: "20px 18px" }}>
              <div className="stats-grid">
                <div style={{ textAlign: "center", padding: "36px 20px 28px", background: "#070A12", borderRadius: "10px", border: "1px solid #0F1629", position: "relative", overflow: "hidden" }}>
                  <div style={{ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 50% 50%, rgba(57,255,20,0.06) 0%, transparent 70%)", pointerEvents: "none" }}></div>
                  <div style={{ fontSize: "64px", fontWeight: "900", color: "#39FF14", lineHeight: 1, fontFamily: "Georgia, serif" }}>{pct}<span style={{ fontSize: "28px" }}>%</span></div>
                  <div style={{ fontSize: "10px", color: "#4A5568", letterSpacing: "2px", marginTop: "4px" }}>OVERALL COMPLETION</div>
                  
                  <div style={{ marginTop: "16px", display: "flex", justifyContent: "center", gap: "24px" }}>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: "20px", fontWeight: "bold", color: "#FF4444" }}>{criticalDone}/{criticalTotal}</div>
                      <div style={{ fontSize: "9px", color: "#4A5568", letterSpacing: "1px" }}>CRITICAL</div>
                    </div>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: "20px", fontWeight: "bold", color: "#E2E8F0" }}>{totalDone}/{allTopics.length}</div>
                      <div style={{ fontSize: "9px", color: "#4A5568", letterSpacing: "1px" }}>TOTAL</div>
                    </div>
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "12px", marginTop: window.innerWidth < 768 ? "18px" : "0" }}>PHASE BREAKDOWN</div>
                  {PHASES.map(ph => {
                    const s = phaseStats(ph);
                    return (
                      <div key={ph.id} style={{ marginBottom: "10px", padding: "13px 14px", background: "#070A12", borderRadius: "6px", border: "1px solid #0F1629" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "7px" }}>
                          <div>
                            <span style={{ fontSize: "9px", color: ph.accent, letterSpacing: "1px", marginRight: "8px" }}>{ph.code}</span>
                            <span style={{ fontSize: "13px", fontFamily: "Georgia, serif" }}>{ph.title}</span>
                          </div>
                          <span style={{ fontSize: "11px", color: ph.accent }}>{s.done}/{s.total}</span>
                        </div>
                        <div style={{ background: "#0D1117", height: "4px", borderRadius: "2px", overflow: "hidden" }}>
                          <div style={{ height: "100%", width: `${s.pct}%`, background: ph.accent, borderRadius: "2px", transition: "width 0.5s ease" }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div style={{ marginTop: "32px", textAlign: "center", gridColumn: "1 / -1" }}>
                <button onClick={handleReset} style={{ background: "transparent", color: "#FF4444", border: "1px solid #FF444430", padding: "10px 16px", borderRadius: "6px", fontSize: "10px", letterSpacing: "1px", cursor: "pointer" }}>
                  CLEAR ALL PROGRESS
                </button>
              </div>
            </div>
          )}

          {/* JOB GUIDE VIEW */}
          {view === "guide" && (
            <div style={{ padding: "20px 18px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "14px" }}>2026 JOB MARKET INTEL</div>
              
              <div className="job-grid">
                {[
                  { title: "Entry-Level GenAI Dev", color: "#39FF14", salary: "$80K – $120K", must: ["Python proficiency", "FastAPI basics", "OpenAI/Anthropic APIs", "RAG fundamentals", "LangChain basics"], note: "Build 2–3 portfolio projects (chatbot, RAG app, API with streaming)" },
                  { title: "Mid-Level AI Engineer", color: "#00D4FF", salary: "$120K – $180K", must: ["Production RAG pipelines", "LangGraph / agentic systems", "LLMOps & observability", "Vector DBs in prod", "FastAPI + deployment"], note: "Focus on LangSmith, RAGAS eval, cloud deployment (AWS/GCP)" },
                  { title: "Senior GenAI Engineer", color: "#FFD700", salary: "$180K – $280K", must: ["Multi-agent architectures", "Custom eval frameworks", "Fine-tuning & RLHF", "AI governance", "System design for AI at scale"], note: "Specialize in Voice AI, GraphRAG, or enterprise compliance" },
                ].map(tier => (
                  <div key={tier.title} style={{ padding: "16px", background: "#070A12", borderRadius: "8px", border: `1px solid ${tier.color}30` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "10px" }}>
                      <div style={{ fontSize: "13px", fontFamily: "Georgia, serif", fontWeight: "bold" }}>{tier.title}</div>
                      <div style={{ fontSize: "11px", color: tier.color }}>{tier.salary}</div>
                    </div>
                    <div style={{ fontSize: "9px", letterSpacing: "2px", color: "#4A5568", marginBottom: "6px" }}>MUST KNOW</div>
                    {tier.must.map(item => (
                      <div key={item} style={{ fontSize: "11px", color: "#94A3B8", marginBottom: "3px", display: "flex", alignItems: "center", gap: "6px" }}>
                        <span style={{ color: tier.color, fontSize: "8px" }}>▸</span> {item}
                      </div>
                    ))}
                    <div style={{ marginTop: "10px", padding: "8px 10px", background: tier.color + "0d", borderLeft: `2px solid ${tier.color}`, fontSize: "10px", color: "#6B7280", lineHeight: "1.4" }}>
                      💡 {tier.note}
                    </div>
                  </div>
                ))}
              </div>
              
              <div style={{ padding: "16px", background: "#070A12", borderRadius: "8px", border: "1px solid #1A1F2E", marginTop: "24px" }}>
                <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "10px" }}>🔥 HOTTEST SKILLS RIGHT NOW</div>
                <div className="job-grid" style={{ gap: "0" }}>
                  {[
                    ["LangGraph", "22% of agentic job posts", "#C084FC"],
                    ["RAG + Reranking", "80% of senior roles", "#FFD700"],
                    ["FastAPI + LLM streaming", "60% of backend GenAI posts", "#FF6B35"],
                    ["LLMOps / observability", "Fastest growing req", "#00D4FF"],
                    ["Voice AI (Whisper+TTS)", "Niche but $90+/hr contracts", "#34D399"],
                    ["MCP integration", "Emerging — get in early", "#39FF14"],
                  ].map(([skill, stat, color]) => (
                    <div key={skill} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #0F1629" }}>
                      <span style={{ fontSize: "12px", color, fontWeight: "bold" }}>{skill}</span>
                      <span style={{ fontSize: "9px", color: "#4A5568" }}>{stat}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* NOTE MODAL */}
          {noteModal && (
            <div
              className="modal-overlay"
              onClick={e => e.target === e.currentTarget && setNoteModal(null)}
            >
              <div className="modal-content">
                <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#4A5568", marginBottom: "12px" }}>ADD NOTE</div>
                <textarea
                  autoFocus
                  value={noteText}
                  onChange={e => setNoteText(e.target.value)}
                  placeholder="Resources found, key concepts, questions to revisit..."
                  style={{ width: "100%", minHeight: "120px", background: "#0D1117", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#CBD5E0", padding: "12px", fontSize: "13px", fontFamily: "'Courier New', monospace", resize: "none", lineHeight: "1.5" }}
                />
                <div style={{ display: "flex", gap: "10px", marginTop: "12px" }}>
                  <button onClick={() => setNoteModal(null)} style={{ flex: 1, padding: "12px", background: "transparent", border: "1px solid #1A1F2E", borderRadius: "6px", color: "#4A5568", cursor: "pointer", fontSize: "12px", transition: "background 0.2s" }}>CANCEL</button>
                  <button onClick={saveNote} style={{ flex: 2, padding: "12px", background: "#39FF14", border: "none", borderRadius: "6px", color: "#050508", cursor: "pointer", fontSize: "12px", fontWeight: "900", transition: "opacity 0.2s" }}>SAVE NOTE</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
